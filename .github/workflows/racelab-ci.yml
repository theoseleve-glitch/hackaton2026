# RaceLab CI — green gate (B11). ACTIVE.
#
# Activated 2026-06-29 (D74, William's call), moved here from RaceLab/ci/. Lives at
# the monorepo root because GitHub only reads workflows from
# <repo-root>/.github/workflows. Scoped to RaceLab/** so it never runs CI for the
# sibling r2/ and SETUP_RC/ trees in this shared monorepo.
#
# What it does: on any push/PR touching RaceLab/**, run every package's test
# suite + typecheck (the engine eval + validate-live grounding gate are part of
# `engine` npm test), the server suite, and the app typecheck. Red blocks the
# merge. Zero secrets — the whole tier is pure/offline at test time (no DB, no
# network, no deploy).

name: racelab-ci
on:
  push:
    paths: ["RaceLab/**"]
  pull_request:
    paths: ["RaceLab/**"]

jobs:
  packages:
    name: "pkg: ${{ matrix.pkg }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - schema
          - engine
          - kb
          - storage
          - account
          - weather
          - speedhive
          - sessions
          - sheets
          - garage
          - logbook
          - tracks
          - strategy
          - social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        working-directory: RaceLab/packages/${{ matrix.pkg }}
        run: npm install --no-audit --no-fund
      - name: typecheck
        working-directory: RaceLab/packages/${{ matrix.pkg }}
        run: npm run typecheck --if-present
      - name: test
        working-directory: RaceLab/packages/${{ matrix.pkg }}
        run: npm test

  server:
    name: "server (Tier B)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - working-directory: RaceLab/server
        run: npm install --no-audit --no-fund
      - working-directory: RaceLab/server
        run: npm run typecheck
      - working-directory: RaceLab/server
        run: npm test

  app-typecheck:
    name: "app: tsc"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - working-directory: RaceLab/apps/mobile
        run: npm install --no-audit --no-fund
      - working-directory: RaceLab/apps/mobile
        run: npx tsc --noEmit
