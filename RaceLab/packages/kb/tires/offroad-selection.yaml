# Off-road TIRE-SELECTION KB (D75) — pre-purchase "which profile to buy" knowledge.
#
# Each entry maps a surface/grip/temp/wet context → a tread profile + compound to BUY,
# for one or more off-road classes. Consumed by packages/engine/src/tire-advisor.ts
# (recommendTires → top-2 distinct profiles). Kept ORTHOGONAL to the tuning rules bundle
# (its own loader + grounding test) so it can't disturb the rules pipeline / validate-live.
#
# GROUNDED OR SILENT (D18/D53): every entry carries a real published source in `sources`
# (manufacturer tire-selection guide / named book / race guide — internal provenance).
# Entries were authored ONLY from the source-VERIFIED output of the
# `offroad-tire-selection-grounding` research+adversarial-verify workflow (2026-06-29).
#
# Surface families (from schema.surfaceToTags): loose_dirt | clay | blue_groove |
# astroturf | carpet | wet. grip from low_grip/high_grip/blue_groove; temp from hot/cold.
#
# COVERAGE NOTE: clay was NOT authored — its research cluster's verify stage was
# rate-limited, so under grounded-or-silent the advisor honestly refuses on clay until a
# re-run verifies it. sand/grass have no distinct surface-family tag yet (sand folds into
# loose_dirt, grass is unmapped) — deferred to a schema.surfaceToTags follow-up.

# ── LOOSE / LOAMY DIRT — tread digs; compound by air temp (AKA ladder) ────────
- id: tsel-loosedirt-spike-cold
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad, 1-10-2wd-offroad, 1-10-4wd-offroad, 1-10-stadium, 1-10-shortcourse]
  match: { surface: loose_dirt, grip: [], temp: [cold] }
  tread: spike
  compound: super-soft
  examples: ["Pro-Line Hole Shot (M4)", "AKA Cross Brace (super-soft)", "JConcepts Goose Bumps (Green)"]
  rationale: "On loose loam grip comes from the lug digging in — run a large-spike tread; cold/low-grip wants the softest compound."
  sources:
    - "JConcepts Tire Selection Guide (official PDF, horizonhobby/towerhobbies): 'tires with large spikes should be chosen for tracks with loamy, fluffy, or wet dirt'"
    - "AKA Tire Compound Guide (RSRC reproduction): 'Below 5C or very low grip → Ultra Soft; 5-15C or low grip → Super Soft'"
  confidence: high

- id: tsel-loosedirt-spike-mild
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad, 1-10-2wd-offroad, 1-10-4wd-offroad, 1-10-stadium, 1-10-shortcourse]
  match: { surface: loose_dirt, grip: [], temp: [mild] }
  tread: spike
  compound: soft
  examples: ["Pro-Line Hole Shot (M3)", "AKA Cross Brace (soft)", "JConcepts Falcon (Blue)"]
  rationale: "Large-spike tread for loam; mild temps / medium grip take the Soft compound."
  sources:
    - "JConcepts Tire Selection Guide (official): large spikes for loamy/fluffy/wet dirt"
    - "AKA Tire Compound Guide (RSRC): '15-25C or medium grip → Soft'"
  confidence: high

- id: tsel-loosedirt-spike-hot
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad, 1-10-2wd-offroad, 1-10-4wd-offroad, 1-10-stadium, 1-10-shortcourse]
  match: { surface: loose_dirt, grip: [], temp: [hot] }
  tread: spike
  compound: medium
  examples: ["JConcepts Goose Bumps (Yellow / medium)", "AKA Medium"]
  rationale: "Keep the digging spike tread, but step UP to Medium in the heat / high grip so the tyre stays durable and doesn't grease over."
  sources:
    - "JConcepts Tire Selection Guide (official): 1/8 buggy large-spike patterns (Goose Bumps, Crowbars, Hit Men) rated Yellow/Medium = Excellent for Loamy"
    - "AKA Tire Compound Guide (RSRC): 'high temperature or very high grip → Medium (hardest, most durable)'"
  confidence: high

- id: tsel-loosedirt-block-001
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad, 1-10-stadium, 1-10-shortcourse]
  match: { surface: loose_dirt, grip: [], temp: [] }
  tread: block/lug
  compound: soft
  examples: ["AKA Cross Brace (soft)", "Pro-Line Blockade SC (M3)"]
  rationale: "A large square-pin + centre-bar block tread is the alternative loose-loam profile — puts power to the ground across loose-to-loamy going."
  sources:
    - "AKA Cross Brace (Horizon Hobby): 'really stands out in loose to loamy track conditions... larger square pins and center bars... deliver the power to the ground'"
    - "Pro-Line Blockade SC (Pro-Line/retailers): 'from hard packed to blue-groove and loose to loamy'"
  confidence: high

# ── HARD-PACKED / BLUE-GROOVE — small pins, run high-grip ─────────────────────
- id: tsel-bluegroove-minipin-001
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad, 1-10-2wd-offroad, 1-10-4wd-offroad, 1-10-stadium, 1-10-shortcourse]
  match: { surface: blue_groove, grip: [high], temp: [] }
  tread: mini-pin
  compound: soft
  examples: ["JConcepts small-pin patterns (soft)", "Pro-Line hard-pack mini-pin"]
  rationale: "Hard-packed / blue-groove takes rubber, not lugs — a soft-compound small-pin (mini-pin) tread is the pick."
  sources:
    - "JConcepts Tire Selection Guide (official): 'Soft compound tires with small pins should be used for hard-packed, dusty, or slick tracks'"
  confidence: high

- id: tsel-bluegroove-dualpin-001
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad]
  match: { surface: blue_groove, grip: [high], temp: [] }
  tread: dual-stage pin
  compound: medium
  examples: ["Pro-Line Caliber (M3/M4)"]
  rationale: "A dual-stage pin works when a hard-packed/blue-groove line carries a light loose top layer — base pin grips the groove, small top pin handles the dust."
  sources:
    - "Pro-Line Caliber (Pro-Line/AMain): 'small top pin for light to heavy loose dirt and a base pin that is extraordinary on hard-packed/blue-groove surfaces'"
  confidence: high

# ── ASTROTURF — spike (long pile) or pin (short/purpose-built) ────────────────
- id: tsel-astro-spike-001
  scope: [1-10-2wd-offroad, 1-10-4wd-offroad]
  match: { surface: astroturf, grip: [], temp: [mild, hot] }
  tread: spike
  compound: medium
  examples: ["Schumacher Mini Spike (Yellow / medium)"]
  rationale: "Longer / shag astroturf pile needs a true spike to dig into the fibres; medium (Yellow) is the dry-weather default."
  sources:
    - "Robin Schumacher (LiveRC): 'A longer pile, more shag... requires an adequate spike to dig into the fibres'; 'Yellow... medium compound... most widely used for dry weather racing'"
  confidence: high

- id: tsel-astro-pin-001
  scope: [1-10-2wd-offroad, 1-10-4wd-offroad]
  match: { surface: astroturf, grip: [], temp: [mild, hot] }
  tread: pin (pyramid)
  compound: medium
  examples: ["Pro-Line Pyramid Z3 (medium)", "JConcepts Lockness (Pink)"]
  rationale: "Short-pile / purpose-built astro carcass runs a self-sharpening pyramid pin; medium compound for warm, higher-bite days."
  sources:
    - "Pro-Line Pyramid Z3/Z4 (Pro-Line): pyramid knife-edge pins, carcass 'optimized for the demands of Astro racing'; 'Z4... softer than Z3... colder temperatures'"
  confidence: high

- id: tsel-astro-spike-cold
  scope: [1-10-2wd-offroad, 1-10-4wd-offroad]
  match: { surface: astroturf, grip: [], temp: [cold] }
  tread: spike
  compound: super-soft
  examples: ["Schumacher (Silver / super-soft)", "Pro-Line Pyramid Z4 (soft)"]
  rationale: "Cold/wet astro: keep the spike tread but drop to the super-soft compound for grip."
  sources:
    - "Robin Schumacher (LiveRC): 'The much softer Silver compound works well in wet conditions'"
    - "Pro-Line Z4 (Red RC): 'softer than the proven Z3 and will excel on less grippy tracks or in colder temperatures'"
  confidence: high

# ── OFF-ROAD CARPET — small pins ──────────────────────────────────────────────
- id: tsel-carpet-minipin-001
  scope: [1-10-2wd-offroad, 1-10-4wd-offroad]
  match: { surface: carpet, grip: [], temp: [mild, hot] }
  tread: mini-pin
  compound: medium
  examples: ["Schumacher Cactus (Yellow / medium)", "JConcepts Pin Downs (Pink)"]
  rationale: "Carpet wants short pins, not long spikes; medium (Yellow) is the dry default, the Cactus pin balances grip and long life."
  sources:
    - "Robin Schumacher (LiveRC): 'Carpet tires require much shorter spikes... commonly referred to as pins'; Cactus 'optimized for modern carpet racing with a superior balance of grip and long life'"
    - "JConcepts Pin Downs (blog 2016): 'work best on Carpet and Astroturf tracks where typically a small pin tire is working'; Pink = medium-soft"
  confidence: high

- id: tsel-carpet-pin-cold
  scope: [1-10-2wd-offroad, 1-10-4wd-offroad]
  match: { surface: carpet, grip: [], temp: [cold] }
  tread: pin
  compound: super-soft
  examples: ["Schumacher (Silver / super-soft)"]
  rationale: "Cold/wet carpet: same pin tread, super-soft (Silver) compound for grip."
  sources:
    - "Robin Schumacher (LiveRC): 'The much softer Silver compound works well in wet conditions'"
  confidence: high

# ── WET — profile depends on whether mud PACKS or the going is SOFT ────────────
- id: tsel-wet-lowtread-001
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad]
  match: { surface: wet, grip: [], temp: [], wet: true }
  tread: low-profile (sheds packed mud)
  compound: super-soft
  examples: ["AKA P-One"]
  rationale: "When wet mud PACKS into tall lugs the tyre goes slick — a lower-profile pattern sheds it; pair with the softest compound for the low grip."
  sources:
    - "AKA selection guide (RSRC): 'if the track is wet and the mud is sticking to the tyre, we will choose the P-one for its lower tread pattern'"
  confidence: high

- id: tsel-wet-stepbar-001
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad, 1-10-2wd-offroad, 1-10-4wd-offroad]
  match: { surface: wet, grip: [], temp: [], wet: true }
  tread: stepped tall-base bar
  compound: super-soft
  examples: ["JConcepts Subcultures (Green / super-soft)"]
  rationale: "Wet AND soft going: a stepped, taller-base tread reaches through the soft surface; the green super-soft compound is best for wet dirt."
  sources:
    - "JConcepts Subcultures green release (blog 2010): 'excel on... wet or when traction is hard to come-by... the step base give the necessary height for wet and soft conditions'"
  confidence: high

# ── CLAY — high-bite/prepped clay: clay compound, low tread (race-proven, D77) ─
- id: tsel-clay-slick-110
  scope: [1-10-2wd-offroad, 1-10-4wd-offroad]
  match: { surface: clay, grip: [high], temp: [] }
  tread: slick / low-pin
  compound: clay
  examples: ["AKA clay-compound slick", "Pro-Line Positron / Electron (clay)"]
  rationale: "On smooth, very high-bite clay the top 1/10 class runs a SLICK (or lowest-profile pin) in a clay compound — maximum rubber on the ground, grip from the compound not the lugs."
  sources:
    - "IFMAR 1/10 EP Off-Road Worlds 2023 (Hobby Action, Chandler — smooth high-bite indoor clay): AKA Clay-compound Slick was the CONTROL tyre run by the 2WD & 4WD A-mains (LiveRC spec-tyre announcement; JConcepts race report: 'AKA slicks... all the way around')"
    - "Pro-Line Positron (teams.prolineracing.com): 'improved grip and corner speed on indoor clay tracks'"
  confidence: high

- id: tsel-clay-minipin-001
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad, 1-10-2wd-offroad, 1-10-4wd-offroad, 1-10-stadium, 1-10-shortcourse]
  match: { surface: clay, grip: [], temp: [] }
  tread: mini-pin
  compound: clay
  examples: ["Pro-Line Buck Shot (MC clay)", "JConcepts Gold/Silver (indoor clay)", "Matrix clay"]
  rationale: "Prepped / high-bite clay runs a small directional mini-pin in a clay compound; the clay rubber keys into the tacky surface where bigger lugs grease over."
  sources:
    - "Pro-Line Buck Shot (Pro-Line/BigSquid): directional micro-pin for indoor high-bite clay; MC = ultra high-bite clay compound"
    - "JConcepts Tire Selection Guide (official): indoor-clay compounds (Gold/Silver) for prepped clay"
  confidence: high

# ── 1/8 GROOMED / HIGH-GRIP dry dirt: the tread changes with GRIP (race-validated, D77/D78). ─
# A 1/8 dirt track that rubbers/grooms in (high grip) wants a web-bar or pin-on-block, NOT the
# aggressive loamy pin (which tears/balloons) — and a FIRMER (medium) compound. grip[high] so
# these outscore the loamy temp-ladder spike when the track is high-grip; low/unset grip falls
# back to the loamy spike.
- id: tsel-18-groomed-web
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad]
  match: { surface: loose_dirt, grip: [high], temp: [] }
  tread: web / connected-bar
  compound: medium
  examples: ["JConcepts Ellipse", "JConcepts Dirt Web 2"]
  rationale: "Once a 1/8 dirt track grooms in and rubbers up, a web / connected-bar tread gives forward bite + high-speed stability where an aggressive loamy pin tears and balloons; run a firmer (medium) compound, never super-soft on a blue-groove."
  sources:
    - "EFRA 1/8 IC Off-Road Euros 2024 (Sacile/OngaroRing, 23-27 Jul): winner Juan Carlos Canas ran the A-main on JConcepts Ellipse, qualifying on Dirt Web 2 + Ellipse as the track grooved in (blog.jconcepts.net)"
    - "JConcepts Dirt Web 2: built for tracks that are 'smooth, rubber, or glue impregnated, making racing super high-speed and consistent'"
  confidence: high

- id: tsel-18-groomed-pinblock
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad]
  match: { surface: loose_dirt, grip: [high], temp: [] }
  tread: pin-on-block
  compound: medium
  examples: ["AKA Cityblock", "JetKo Block-In", "Pro-Line Caliber"]
  rationale: "On hard, high-bite groomed / blue-groove dirt the pin-on-block locks the car in with side + forward bite while the underlying blocks add depth for hour-long mains — the lower-wear all-rounder vs a full web on abrasive grip."
  sources:
    - "AKA Cityblock (AMain): 'locks vehicle in with a high degree of traction and control on hard pack or blue groove tracks ... square mini pins ... superior grip on a hard-packed, high-traction racing surface'"
  confidence: high

- id: tsel-18-groomed-densepin
  scope: [1-8-offroad, 1-8-nitro-offroad, 1-8-e-offroad]
  match: { surface: loose_dirt, grip: [high], temp: [hot] }
  tread: dense pin (long-wear)
  compound: medium
  examples: ["Hot Race Sahara", "JetKo Lesnar", "AKA P1 / Double Down"]
  rationale: "Baked, dry, dusty-but-high-bite dirt: a dense low pin in a medium / long-wear compound survives the abrasion + heat that grease over a soft loamy tyre."
  sources:
    - "IFMAR 1/8 E-Buggy Worlds 2025 (Barcelos, fresh high-grip dirt going dusty): winner Kaerup + TQ Boots ran Hot Race Sahara (redrc chassis-focus)"
    - "IFMAR 1/8 IC Worlds 2024 (Redovan, firm high-grip dirt): Hot Race the single most-listed tyre brand among entrants"
  confidence: high

