# RaceLab feedback-tag taxonomy (docs/04 §2)
# A driver feedback tag = (symptom, phase?, evolution?)

symptoms:
  - id: understeer        # push — car won't rotate
  - id: oversteer         # loose — rear steps out
  - id: bouncy            # car bounces/pogos over bumps
  - id: bottoming         # chassis slaps on landings/bumps
  - id: traction_roll     # car rolls over in corners
  - id: unstable_braking  # rear wanders/swaps under braking
  - id: no_forward_bite   # wheelspin, poor drive out of corners
  - id: sluggish_steering # slow/lazy steering response
  - id: twitchy           # nervous, over-responsive, hard to drive
  - id: nosedive_jumps    # noses down off jumps
  - id: poor_bump_handling   # deflects/skips over rough sections
  - id: hard_to_drive     # general: car wears the driver out

phases:
  - id: corner_entry
  - id: mid_corner
  - id: corner_exit
  - id: on_power
  - id: off_power
  - id: braking
  - id: jumps
  - id: rough_section
  - id: high_speed
  - id: low_speed

evolution:
  - id: from_start
  - id: as_tires_heat
  - id: as_grip_comes_up
  - id: when_pushing

# Condition vocabulary used by rules (conditions.amplified_on / reduced_on)
conditions:
  - low_grip
  - high_grip
  - blue_groove
  - dusty
  - wet
  - bumpy
  - rough
  - smooth
  - technical_tight
  - fast_open
  - big_jumps
  - hot
  - cold
  # surface (world map §3a) — compose with the grip tags above
  - clay
  - loose_dirt
  - astroturf
  - carpet
  - asphalt
  - indoor
  - outdoor
  # power sub-class (world map §3b) — gates motor-tuning + spec legality
  - stock_blinky
  - modified_power
  - spec_locked
  - nitro_power
  - gas_power

# Class-scope vocabulary: rule.scope and template.scope are matched by exact
# string intersection (retrieval.ts), so a tag not in this list silently never
# fires. The validator (data.ts validateScopes) enforces every rule/template
# scope tag is drawn from here — a typo or a stray dialect is a build error.
scopes:
  - 1-8-offroad
  - 1-8-nitro-offroad
  - 1-8-e-offroad
  - 1-8-truggy
  - 1-8-gt
  - 1-10-offroad
  - 1-10-2wd-offroad
  - 1-10-4wd-offroad
  - 1-10-stadium
  - 1-10-shortcourse
  - 1-10-touring
  - 1-10-nitro-onroad
  - 1-12-pan
  - 1-10-f1
  - large-scale
  - monster-truck
  - crawler
  - rally

# Engine-scope tags: any request matching these MUST get the canned refusal (D13)
engine_scope_refusal:
  keywords:
    - needle
    - hsn
    - lsn
    - idle screw
    - carb
    - carburetor
    - glow plug
    - plug temperature
    - flameout
    - flame out
    - running lean
    - lean it out
    - too lean
    - lean the needle
    - too rich
    - rich mixture
    - richen
    - engine temp
    - break-in
    - break in
    - fuel mixture
    - nitro percentage
  refusal: >-
    Engine tuning (needles, plugs, mixture, temperatures) is out of my scope for
    now — getting it wrong can destroy an engine, so I only advise on chassis
    settings I have verified rules for. Refer to your engine manufacturer's
    manual for factory needle baselines, and tune from rich to lean in small
    steps with a temp gauge.
