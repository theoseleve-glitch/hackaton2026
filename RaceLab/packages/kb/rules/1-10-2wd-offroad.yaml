# 1/10 2WD electric off-road buggy — DRAFT tuning rules
#
# STATUS: DRAFT. Not auto-shipped. Pending human citation sign-off before promotion
#   out of rules/drafts/ into the live KB. Schema-validated against the live rule
#   format (packages/kb/rules/geometry.yaml) and the category template
#   (packages/kb/chassis/categories/1_10_offroad_2wd.json — every `setting:` here is a
#   real key in that template's `fields`, so the engine capability gate passes).
#
# GROUNDING (D18 — grounded or silent). Every rule cites at least one real source from
#   docs/research/world-map/sources.json that covers 1/10 off-road. Two grades of cite:
#     - PAGE-CITABLE backbone (real fixed-layout file/book with the exact page filled in).
#       Every rule now carries at least one TBD-free page cite, extracted via pdftotext
#       (2026-06-16): "AE RC Cheat Sheets p.NN (<topic>)" from RC_CheatSheets.pdf, and
#       "Hudy Setup Tips p.NN (<section> — <effect as the book states it>)" from the off-road
#       for the cause->effect axes the AE sheet does not cover off-road (caster, rear toe,
#       front/rear droop). The Stevens book is print/eBook so its lines stay "[section TBD]"
#       SECONDARY corroborations — never the sole cite. The "Traxxas Slash Spec Racing Setup
#       Guide" lines are rear-drive SC concrete effect text, VERIFIED-FETCHED.
#     - CORROBORATION (web, mutable — NEVER a sole cite, per D18): "CompetitionX RC Tuning Guide — <topic> (corroboration)".
#       Every CompetitionX cite here was fetched-and-verified 2026-06-16; the quoted
#       effect text is paired with a page-citable backbone source, never standing alone.
#
# 2WD-SPECIFIC PHYSICS: rear-drive buggy. Weight transfer, rear traction, the slipper/ball
#   diff and rear-tyre-vs-surface dominate. Front has NO drive. Surface (loose_dirt / clay /
#   astroturf / carpet) flips several changes — high-bite changes carry forbidden_on:[loose_dirt]
#   where they actively hurt on loose dirt. Power class gates motor/gearing legality.
#
# scope on every rule: [1-10-offroad, 1-10-2wd-offroad]

# ============================================================================
# FAMILY: SHOCKS / OIL / PISTONS
# ============================================================================

- id: kb-2wd-shockoil-rear-thicker-001
  setting: rear_shock_oil
  direction: increase   # thicker / heavier rear oil
  effects:
    - { axis: chassis_roll_on_power, change: less }
    - { axis: landing_pack, change: more }
    - { axis: low_speed_rear_compliance, change: less }
  addresses:
    - { symptom: bottoming, phase: jumps }
    - { symptom: oversteer, phase: on_power }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough, low_grip]
  counter_indications: [no_forward_bite, poor_bump_handling]
  magnitude_guidance: "One oil step (~50-100 cSt / ~2.5wt) at a time. Thicker rear oil holds the chassis flatter on power and gives pack for landings; too thick kills forward bite over bumps."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.39 (Shock Fluid — thicker/heavier oil: less bottoming out; off-road)"
    - "Traxxas Slash Spec Racing Setup Guide (rear 60wt: ample pack for jump landings, keeps chassis roll to a minimum)"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: heavier oil better for smooth tracks, decreases responsiveness)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-shockoil-rear-thinner-002
  setting: rear_shock_oil
  direction: decrease   # thinner / lighter rear oil
  effects:
    - { axis: rear_compliance_over_bumps, change: more }
    - { axis: forward_bite_rough, change: more }
    - { axis: chassis_roll, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: rough_section }
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: bouncy, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough, low_grip, loose_dirt]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [oversteer, bottoming]
  magnitude_guidance: "One oil step (~50-100 cSt) thinner at a time. Frees the rear to react over bumps for forward bite on rough/loose surfaces; too thin lets the rear roll and wallow."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.39 (Shock Fluid — thinner/lighter oil: faster rebound for many small bumps; off-road)"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: lighter oil more responsive, better for bumpy conditions, allows more chassis roll)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-shockoil-front-thicker-003
  setting: front_shock_oil
  direction: increase   # thicker front oil
  effects:
    - { axis: front_dive_braking, change: less }
    - { axis: initial_steering_reaction, change: slower }
    - { axis: front_bottoming, change: less }
  addresses:
    - { symptom: nosedive_jumps, phase: jumps }
    - { symptom: twitchy, phase: braking }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough]
  counter_indications: [sluggish_steering, understeer]
  magnitude_guidance: "One oil step (~50-100 cSt) at a time. Slows the front to calm dive into jumps and braking twitch; too thick makes the front skate over bumps and steering go lazy."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.39 (Shock Fluid — thicker/heavier oil: less bottoming out; off-road)"
    - "Traxxas Slash Spec Racing Setup Guide (front lighter than rear to balance the lighter front end; thicker oil keeps chassis from bottoming harshly)"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: heavier oil seems sluggish, better for smooth tracks)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-shockoil-front-thinner-004
  setting: front_shock_oil
  direction: decrease   # thinner front oil
  effects:
    - { axis: front_compliance_over_bumps, change: more }
    - { axis: initial_steering_reaction, change: faster }
    - { axis: low_speed_front_grip, change: more }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [bumpy, rough, low_grip]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [twitchy, nosedive_jumps]
  magnitude_guidance: "One oil step (~50-100 cSt) thinner at a time. Frees the front to follow rough ground and react quicker on turn-in; too thin lets the front dive on braking and off jumps."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.39 (Shock Fluid — thinner/lighter oil: faster rebound for many small bumps; off-road)"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: lighter oil more responsive, better for bumpy conditions)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-piston-rear-more-holes-005
  setting: rear_shock_piston
  direction: increase   # more / larger bleed holes — freer
  effects:
    - { axis: rear_damping, change: freer }
    - { axis: rear_compliance_over_bumps, change: more }
    - { axis: high_speed_pack, change: less }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: no_forward_bite, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough, loose_dirt]
    reduced_on: [smooth, high_grip]
  counter_indications: [bottoming]
  magnitude_guidance: "One piston step (one extra/larger hole) at a time. More holes free the rear over bumps for forward bite; pair with the right oil — pistons set the high/low-speed split, oil sets overall rate."
  reversal_cost_minutes: 12
  confidence: medium
  sources:
    - "AE RC Cheat Sheets p.40 (Shock Pistons — larger holes: less damping, for small bumps; off-road)"
    - "CompetitionX RC Tuning Guide — Shock Oil/Pistons (corroboration: more/larger holes pass oil quicker = more responsive damping; rougher track = more holes)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-piston-rear-fewer-holes-006
  setting: rear_shock_piston
  direction: decrease   # fewer / smaller holes — more pack
  effects:
    - { axis: rear_damping, change: stiffer }
    - { axis: high_speed_pack, change: more }
    - { axis: landing_hold_up, change: more }
  addresses:
    - { symptom: bottoming, phase: jumps }
    - { symptom: bouncy, phase: jumps }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough]
  counter_indications: [poor_bump_handling, no_forward_bite]
  magnitude_guidance: "One piston step (one fewer/smaller hole) at a time. Fewer holes add pack so the rear holds up on big landings; too few and it deflects over chop."
  reversal_cost_minutes: 12
  confidence: medium
  sources:
    - "AE RC Cheat Sheets p.40 (Shock Pistons — smaller holes: more damping/more pack, improve jump lifts and landings for smoother tracks; off-road)"
    - "CompetitionX RC Tuning Guide — Shock Oil/Pistons (corroboration: fewer/smaller holes pass oil slower; smoother track = fewer holes)"
  scope: [1-10-2wd-offroad]

# ============================================================================
# FAMILY: SPRINGS
# ============================================================================

- id: kb-2wd-rearspring-softer-007
  setting: rear_spring
  direction: decrease   # softer rear spring
  effects:
    - { axis: rear_traction, change: more }
    - { axis: forward_bite, change: more }
    - { axis: rear_roll, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: no_forward_bite, phase: on_power }
  conditions:
    amplified_on: [low_grip, loose_dirt, bumpy]
    reduced_on: [high_grip, smooth]
  counter_indications: [traction_roll, oversteer]
  forbidden_on: [astroturf]   # on very-high-bite astroturf a softer rear adds roll and traction-rolls
  magnitude_guidance: "One spring rate softer at a time. A softer rear lets the rear squat and load the tyres for forward bite on low grip; on high-bite surfaces it brings on traction roll."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.41 (Shock Springs — softer/lighter tension: great on rear for off-road, gives more traction, best for small bumps)"
    - "Dave B Stevens — Essential Off-road RC Racer's Guide (springs) [section TBD]"
    - "CompetitionX RC Tuning Guide — Shock Springs (corroboration: softer end gains grip)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-rearspring-stiffer-008
  setting: rear_spring
  direction: increase   # stiffer rear spring
  effects:
    - { axis: rear_roll, change: less }
    - { axis: on_power_stability, change: more }
    - { axis: forward_bite_low_grip, change: less }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: oversteer, phase: on_power }
  conditions:
    amplified_on: [high_grip, smooth, astroturf]
    reduced_on: [low_grip, loose_dirt, bumpy]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "One spring rate stiffer at a time. A stiffer rear cuts roll and traction-roll on high bite; too stiff and it loses forward bite on low grip."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.41 (Shock Springs — stiffer/heavier tension: creates less traction, lifts higher off jumps, better suspension response)"
    - "Dave B Stevens — Essential Off-road RC Racer's Guide (springs) [section TBD]"
    - "CompetitionX RC Tuning Guide — Shock Springs (corroboration: stiffer end loses grip / reduces roll)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-frontspring-softer-009
  setting: front_spring
  direction: decrease   # softer front spring
  effects:
    - { axis: front_grip, change: more }
    - { axis: front_dive_braking, change: more }
    - { axis: steering_into_corner, change: more }
  addresses:
    - { symptom: understeer, phase: mid_corner }
    - { symptom: understeer, phase: corner_entry }
  conditions:
    amplified_on: [low_grip, bumpy, loose_dirt]
    reduced_on: [high_grip, smooth]
  counter_indications: [traction_roll, twitchy]
  magnitude_guidance: "One spring rate softer at a time. A softer front loads the front tyres for more steering and bump compliance; too soft and it dives and traction-rolls on bite."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.41 (Shock Springs — softer/lighter tension: gives more traction, best for small bumps; controls how the car corners)"
    - "Dave B Stevens — Essential Off-road RC Racer's Guide (springs) [section TBD]"
    - "CompetitionX RC Tuning Guide — Shock Springs (corroboration: heavier springs normally run front than rear; softer end gains grip)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-frontspring-stiffer-010
  setting: front_spring
  direction: increase   # stiffer front spring
  effects:
    - { axis: front_roll, change: less }
    - { axis: front_dive_braking, change: less }
    - { axis: steering, change: less }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: twitchy, phase: corner_entry }
  conditions:
    amplified_on: [high_grip, smooth, astroturf]
    reduced_on: [low_grip, loose_dirt, bumpy]
  counter_indications: [understeer]
  magnitude_guidance: "One spring rate stiffer at a time. A stiffer front cuts roll and dive and calms a darty front on high bite; too stiff and the front pushes."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.41 (Shock Springs — stiffer/heavier tension: creates less traction, better suspension response, reduces chassis roll)"
    - "Dave B Stevens — Essential Off-road RC Racer's Guide (springs) [section TBD]"
    - "CompetitionX RC Tuning Guide — Shock Springs (corroboration: stiffer end reduces roll, loses grip)"
  scope: [1-10-2wd-offroad]

# ============================================================================
# FAMILY: GEOMETRY — camber / caster / toe
# ============================================================================

- id: kb-2wd-frontcamber-more-neg-011
  setting: front_camber
  direction: decrease   # more negative front camber
  effects:
    - { axis: cornering_front_grip, change: more }
    - { axis: straight_line_stability, change: less }
  addresses:
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: [high_grip]
    reduced_on: [low_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "0.5deg more negative at a time (typical -1 to -2deg front). Loads the outer front tyre through the corner for more cornering grip; past ~-2deg the straight gets nervous and forward roll grip drops."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.12 (Camber, front — more negative (2 deg.): more high-speed traction through turns; less: more straight-line acceleration)"
    - "Traxxas Slash Spec Racing Setup Guide (front -2.0deg gives a good contact patch through the corner)"
    - "CompetitionX RC Tuning Guide — Camber (corroboration: more front camber = more aggressive steering, more high-speed cornering traction, less stable on the straight)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-rearcamber-more-neg-012
  setting: rear_camber
  direction: decrease   # more negative rear camber
  effects:
    - { axis: cornering_rear_grip, change: more }
    - { axis: forward_traction, change: less }
    - { axis: straight_line_stability, change: less }
  addresses:
    - { symptom: oversteer, phase: mid_corner }
    - { symptom: traction_roll, phase: mid_corner }
  conditions:
    amplified_on: [high_grip]
    reduced_on: [low_grip, loose_dirt]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "0.5deg more negative at a time (typical -2 to -2.5deg rear). More rear camber adds mid-corner rear grip when it grips and rolls; it costs straight-line forward traction, so don't chase it on loose dirt."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.15 (Camber, rear — more negative (-2 deg.): more high-speed traction through corners; more positive removes straight-line acceleration)"
    - "Traxxas Slash Spec Racing Setup Guide (rear -2.5deg, set by how much rear traction the track needs)"
    - "CompetitionX RC Tuning Guide — Camber (corroboration: more rear camber = more high-speed cornering traction, less forward traction, less stable on the straight)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-rearcamber-less-neg-013
  setting: rear_camber
  direction: increase   # toward 0 / less negative rear camber
  effects:
    - { axis: forward_traction, change: more }
    - { axis: straight_line_acceleration, change: more }
    - { axis: cornering_rear_grip, change: less }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: no_forward_bite, phase: on_power }
  conditions:
    amplified_on: [low_grip, loose_dirt]
    reduced_on: [high_grip]
  counter_indications: [oversteer]
  magnitude_guidance: "0.5deg toward 0 at a time; never go positive. Standing the rear tyres up puts more flat patch down for forward bite and acceleration; too little and mid-corner rear grip drops."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.15 (Camber, rear — less negative / toward zero: more straight-line acceleration; tyre stands vertical)"
    - "CompetitionX RC Tuning Guide — Camber (corroboration: less rear camber = more straight-line acceleration, less traction in the corners)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-caster-more-014
  setting: caster
  direction: increase   # more caster — more laid back
  effects:
    - { axis: straight_line_stability, change: more }
    - { axis: on_power_steering_exit, change: more }
    - { axis: bump_stability, change: more }
    - { axis: initial_turn_in, change: less }
  addresses:
    - { symptom: twitchy, phase: high_speed }
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: oversteer, phase: corner_entry }
  conditions:
    amplified_on: [bumpy, rough, low_grip, loose_dirt]
    reduced_on: [smooth, high_grip]
  counter_indications: [sluggish_steering, understeer]
  magnitude_guidance: "One caster step (~2-3deg) at a time. NOTE on a 2WD buggy kick-up adds to total caster — count both. More caster steadies the straight and adds on-power/exit steering at the cost of initial bite."
  reversal_cost_minutes: 15
  confidence: high
  sources:
    # REVIEW: book (Caster, Effects of Caster Adjustment p.18) lists ONLY straight-line stability + off-power entry steering + bump stability for more caster. It does NOT state "on-power steering in mid-corner and corner exit" (on_power_steering_exit effect axis). Over-claim trimmed from the cite; verify the axis against another source or drop it.
    - "Hudy Setup Tips p.18 (Caster, Effects of Caster Adjustment — more caster angle (more inclined): increases straight-line stability, decreases off-power steering at corner entry, makes the car more stable through bumpy track conditions)"
    - "CompetitionX RC Tuning Guide — Caster (corroboration: more caster = more on-power steering exiting, more stable on straights and through bumps, easier to drive; kick-up adds to total caster in 2WD)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-caster-less-015
  setting: caster
  direction: decrease   # less caster — more upright
  effects:
    - { axis: initial_turn_in, change: more }
    - { axis: off_power_steering_entry, change: more }
    - { axis: straight_line_stability, change: less }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, rough, low_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "One caster step (~2-3deg) at a time. Less caster sharpens off-power turn-in for tight smooth tracks; it costs straight-line and bump stability, so avoid it on rough/loose tracks."
  reversal_cost_minutes: 15
  confidence: high
  sources:
    # REVIEW: book (Caster, Effects of Caster Adjustment p.18) states for less caster ONLY: decreases straight-line stability, increases off-power steering at corner entry, increases suspension efficiency. It does NOT state "decreases on-power steering in mid-corner and corner exit". That trimmed clause was symmetric to the more-caster over-claim above.
    - "Hudy Setup Tips p.18 (Caster, Effects of Caster Adjustment — less caster angle (more vertical): decreases straight-line stability, increases off-power steering at corner entry, increases suspension efficiency)"
    - "CompetitionX RC Tuning Guide — Caster (corroboration: less caster = quicker steering, more off-power steering entering, less stable on straights and through bumps)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-fronttoe-out-016
  setting: front_toe
  direction: decrease   # toward toe-out
  effects:
    - { axis: initial_turn_in, change: more }
    - { axis: off_power_steering_entry, change: more }
    - { axis: on_power_smoothness, change: less }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: []
    reduced_on: []
  counter_indications: [twitchy]
  magnitude_guidance: "0.5deg toward toe-out at a time, both sides equal (typical 1-3deg total toe-out front on a 2WD). Sharpens initial and off-power turn-in; too much makes the front nervous and grabby."
  reversal_cost_minutes: 4
  confidence: high
  sources:
    - "AE RC Cheat Sheets p.49 (Toe-in, toe-out, front — toe-out: quicker corner turn-in; unstable in bumps and slippery on the straightaway)"
    - "Traxxas Slash Spec Racing Setup Guide (toe-out increases instant steering response; base 1.0deg toe-out per side)"
    - "CompetitionX RC Tuning Guide — Toe (corroboration: toe-out = more off-power steering, more initial turn-in)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-fronttoe-in-017
  setting: front_toe
  direction: increase   # toward toe-in
  effects:
    - { axis: on_power_steering, change: more }
    - { axis: straight_line_stability, change: more }
    - { axis: initial_turn_in, change: less }
  addresses:
    - { symptom: twitchy, phase: high_speed }
    - { symptom: understeer, phase: corner_exit }
  conditions:
    amplified_on: [fast_open]
    reduced_on: [technical_tight]
  counter_indications: [sluggish_steering]
  magnitude_guidance: "0.5deg toward toe-in at a time, both sides. Calms a nervous front and adds on-power/exit steering and straight-line stability; too much dulls initial turn-in."
  reversal_cost_minutes: 4
  confidence: medium
  sources:
    # REVIEW: book front-toe table (Toe, Effects of Toe Adjustment p.20) is sparse: increasing toe-in only states "Makes car easier to drive"; "more stable on-power and on straight" is inferred from the decreasing-toe-in row ("Less stable under acceleration") + the section intro ("Toe is used to stabilize the car"). The AE primary cite carries the straight-line stability claim; the HUDY clause is corroboration only.
    - "AE RC Cheat Sheets p.49 (Toe-in, toe-out, front — toe-out is unstable in bumps and on the straightaway, so toe-in / less toe-out is the more stable / straight-line setting); Hudy Setup Tips p.20 (Toe, Effects of Toe Adjustment, front — increasing toe-in: makes car easier to drive; decreasing toe-in: less stable under acceleration)"
    - "Traxxas Slash Spec Racing Setup Guide (toe-in = better straight-line stability and more steering through and out of a corner)"
    - "CompetitionX RC Tuning Guide — Toe (corroboration: front toe-in = more on-power steering)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-reartoe-more-018
  setting: rear_toe
  direction: increase   # more rear toe-in
  effects:
    - { axis: forward_traction, change: more }
    - { axis: on_power_stability, change: more }
    - { axis: rotation, change: less }
    - { axis: top_speed, change: less }
  addresses:
    - { symptom: oversteer, phase: on_power }
    - { symptom: oversteer, phase: corner_exit }
    - { symptom: no_forward_bite, phase: corner_exit }
  conditions:
    amplified_on: [low_grip, loose_dirt, bumpy]
    reduced_on: [high_grip, smooth]
  counter_indications: [understeer]
  magnitude_guidance: "0.5deg more toe-in at a time (typical 2.5-3.5deg total); rear NEVER runs toe-out. Adds forward bite and on-power stability for low grip; costs rotation and a little top speed."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "Hudy Setup Tips p.20 (Toe, Effects of Toe Adjustment, rear toe — increasing (more toe-in): more stable exiting on-power at corner exit and braking, less chance of losing rear traction, increases understeer, decreases top speed)"
    - "Dave B Stevens — Essential Off-road RC Racer's Guide (rear toe) [section TBD]"
    - "CompetitionX RC Tuning Guide — Toe (corroboration: more rear toe-in = more forward traction, slower acceleration, less rotation; best for low-traction tracks)"
  scope: [1-10-2wd-offroad]

- id: kb-2wd-reartoe-less-019
  setting: rear_toe
  direction: decrease   # less rear toe-in (never below 0)
  effects:
