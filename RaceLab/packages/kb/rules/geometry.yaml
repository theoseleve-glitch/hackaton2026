    - { symptom: sluggish_steering }
  conditions:
    amplified_on: [technical_tight]
    reduced_on: [fast_open, bumpy]
  counter_indications: [twitchy]
  magnitude_guidance: "Move one shim at a time, both sides."
  reversal_cost_minutes: 8
  confidence: high
  sources: ["HUDY Off-Road Set-Up Book p.31 §1.12"]
  scope: [1-8-offroad]

- id: kb-wheelbase-longer-231
  setting: wheelbase
  direction: increase
  effects:
    - { axis: stability, change: more }
    - { axis: bumps_ruts_handling, change: better }
    - { axis: on_power_steering_exit, change: more }
    - { axis: initial_steering_off_power, change: slower }
  addresses:
    - { symptom: twitchy, phase: high_speed }
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: understeer, phase: corner_exit }
  conditions:
    amplified_on: [fast_open, bumpy]
    reduced_on: [technical_tight]
  counter_indications: []   # entry push caveat is carried by the address phase (corner_exit only)
