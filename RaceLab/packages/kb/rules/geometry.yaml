  scope: [1-8-offroad]

# ---- Wheelbase (p.31) ----
- id: kb-wheelbase-shorter-230
  setting: wheelbase
  direction: decrease   # fewer spacers in front of rear upright
  effects:
    - { axis: on_power_traction, change: more }
    - { axis: off_power_steering_entry, change: more }
    - { axis: steering_response, change: more }
    - { axis: on_power_exit, change: slight_push }
  addresses:
    - { symptom: no_forward_bite, phase: on_power }
