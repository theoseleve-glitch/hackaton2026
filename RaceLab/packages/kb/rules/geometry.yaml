  setting: rear_anti_squat
  direction: decrease   # flatter arm
  effects:
    - { axis: rear_traction_off_power, change: more }
    - { axis: rear_traction_on_power, change: less }
    - { axis: bumpy_handling, change: better }
  addresses:
    - { symptom: oversteer, phase: off_power }
    - { symptom: oversteer, phase: corner_entry }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy]
    reduced_on: [smooth, high_grip]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "One bushing/holder step (≈1°), both sides."
