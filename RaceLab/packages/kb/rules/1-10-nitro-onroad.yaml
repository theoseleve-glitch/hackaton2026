# 1/10 200mm NITRO ON-ROAD TOURING SEDAN — tuning rules (LIVE — bundled; promoted 2026-06-17, D55)
#
# Scope: [1-10-nitro-onroad]. On-road only (asphalt / carpet). The clutch, needles, glow plug, 2-speed
# and any engine/fuel tuning are OUT OF SCOPE (D13) — no rule here touches them; those settings exist on
# the template but the engineer refuses on them via taxonomy.yaml engine_scope_refusal.
#
# GROUNDING — every rule cites a source read verbatim with pdftotext during authoring:
#   * "HUDY Set-Up Book" = the HUDY ALL-IN-ONE SET-UP SOLUTION, SET-UP THEORY chapter (printed in-PDF
#     pages 28-46), the on-road geometry/shocks/roll-centre theory. Source file:
#     site.petitrc.com/Tech/Handbooks/HudySetupBook.pdf — flagged "STRONGEST for ON-ROAD/touring" in
#     docs/research/world-map/sources.json. Page numbers below are the printed page numbers of that chapter.
#   * "XRAY NT1 Set-Up Book" = the XRAY NT1 1/10 NITRO ON-ROAD set-up book SET-UP THEORY chapter
#     (teamxray.com/.../nt1_2013_setupbook.pdf) — the dedicated NITRO ON-ROAD reference; in-PDF page
#     numbers used as printed. Used as the primary cite where it is the more class-exact source and as
#     an independent cross-check elsewhere.
#   * "AE RC Cheat Sheets" = Team Associated RC Cheat Sheets, on-road entries, page-cited
#     (site.petitrc.com/reglages/RC_CheatSheets.pdf) — primary cite for tyres (HUDY/NT1 do not cover
#     tyre compound/additive/insert), cross-check elsewhere.
#
# Every direction/effect was read from one of those documents; nothing here is invented.
# `setting:` ids are all keys in kb/chassis/categories/1_10_nitro_onroad.json (capability gate).
# Symptom/phase/condition tags are all drawn from kb/taxonomy.yaml (no invented tags).
#
# CONTRADICTION DISCIPLINE: no two rules give opposing `direction` on the same `setting` for the same
# `symptom` unless their `conditions` are disjoint. The roll-centre pair (asphalt/low-grip vs carpet/
# high-grip) is the canonical HUDY p.31 disjointness — front RC lower is recommended for asphalt &
# low-medium traction, higher for carpet & high traction.

# =====================================================================================================
# FAMILY 1 — SHOCKS (oil)   HUDY Set-Up Book p.40 §2.5 ; XRAY NT1 Set-Up Book p.10-11
# =====================================================================================================

- id: kb-no-shock-front-thinner-501
  setting: front_shock_oil
  direction: decrease          # thinner front oil — faster shock action, more traction over bumps
  effects:
    - { axis: front_shock_action, change: faster }
    - { axis: front_weight_transfer, change: faster }
    - { axis: bump_compliance, change: more }
    - { axis: chicane_settledness, change: less }
  addresses:
    - { symptom: understeer, phase: mid_corner }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy, low_grip, asphalt]
    reduced_on: [smooth, high_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "One oil step (~25-50 cSt) at a time, both front shocks identical. HUDY: thinner oil gives faster shock action that keeps the tyre in contact with the surface for more traction, but the car is more easily unsettled by sharp direction changes (chicanes)."
  reversal_cost_minutes: 15
  confidence: high
  # REVIEW: NT1 p.10 frames thinner FRONT damping as "softer damping = slower steering response, decreases initial steering at corner entry, increases oversteer at corner exit/under acceleration" — it does NOT state a direct "fixes mid-corner understeer" effect; the understeer-fix here is inferred from the resulting rear rotation. Bump/traction-contact claim is HUDY-style, not in NT1; NT1 ties thinner front oil to corner-exit oversteer, not bump traction.
  sources: ["XRAY NT1 Set-Up Book p.10 (Effects of Shock Damping — Front, softer damping / thinner oil)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-shock-front-thicker-502
  setting: front_shock_oil
  direction: increase          # thicker front oil — slower shock action, more high-speed calm
  effects:
    - { axis: front_shock_action, change: slower }
    - { axis: high_speed_stability, change: more }
    - { axis: chicane_settledness, change: more }
    - { axis: low_speed_twitch, change: more }
  addresses:
    - { symptom: twitchy, phase: high_speed }
  conditions:
    amplified_on: [smooth, high_grip, carpet]
    reduced_on: [bumpy, low_grip]
  counter_indications: [sluggish_steering, understeer]
  magnitude_guidance: "One oil step at a time, both front shocks identical. HUDY: thicker oil makes the car more stable at high speed but more twitchy at slow speed, and less likely to be unsettled by sharp direction changes such as chicanes."
  reversal_cost_minutes: 15
  confidence: high
  # REVIEW: NT1 p.10 (Front harder damping / thicker oil): "faster steering response, increases initial steering at corner entry, increases understeer at corner exit/under acceleration." NT1 does NOT explicitly say thicker front oil cures high-speed twitchiness — that high-speed-stability framing is HUDY-style; supported direction-wise (harder damping = more direct/less reactive) but the exact "twitchy@high_speed" address is an inference.
  sources: ["XRAY NT1 Set-Up Book p.10 (Effects of Shock Damping — Front, harder damping / thicker oil)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-shock-rear-thinner-503
  setting: rear_shock_oil
  direction: decrease          # thinner rear oil — faster rear shock action, more forward traction
  effects:
    - { axis: rear_shock_action, change: faster }
    - { axis: rear_traction, change: more }
    - { axis: bump_compliance, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy, low_grip, asphalt]
    reduced_on: [smooth, high_grip]
  counter_indications: [oversteer]
  magnitude_guidance: "One oil step at a time, both rear shocks identical. HUDY: faster (softer) shock action keeps the tyre in contact with the surface, which produces the most grip (front & rear)."
  reversal_cost_minutes: 15
  confidence: high
  # REVIEW: PARTIAL SUPPORT. NT1 p.11 says softer rear damping (thinner oil) "increases rear grip under BRAKING" but "DECREASES rear grip at corner exit/under acceleration" — the OPPOSITE of this rule's corner-exit forward-bite claim. NT1 supports thinner rear oil only for braking-phase grip; the "more rear traction / forward bite on corner_exit / on-power" address is NOT supported by NT1 (it is the HUDY 'soft damping = most grip' generalization). Keep for William's review.
  sources: ["XRAY NT1 Set-Up Book p.11 (Effects of Shock Damping — Rear, softer damping / thinner oil)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-shock-rear-thicker-504
  setting: rear_shock_oil
  direction: increase          # thicker rear oil — flatter on power, calmer at speed, less grip
  effects:
    - { axis: rear_shock_action, change: slower }
    - { axis: high_speed_stability, change: more }
    - { axis: rear_grip, change: less }
  addresses:
    - { symptom: oversteer, phase: on_power }
    - { symptom: twitchy, phase: high_speed }
  conditions:
    amplified_on: [smooth, high_grip, carpet]
    reduced_on: [bumpy, low_grip]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "One oil step at a time, both rear shocks identical. HUDY: thicker oil slows weight transfer and makes the car more stable at high speed; hard damping gives higher cornering speed but breaks traction more easily."
  reversal_cost_minutes: 15
  confidence: high
  sources: ["XRAY NT1 Set-Up Book p.11 (Effects of Shock Damping — Rear, harder damping / thicker oil: decreases rear grip at corner exit/under acceleration)"]
  scope: [1-10-nitro-onroad]

# =====================================================================================================
# FAMILY 2 — RIDE HEIGHT   HUDY Set-Up Book p.36 §2.3 ; XRAY NT1 Set-Up Book p.15
# =====================================================================================================

- id: kb-no-rideheight-lower-505
  setting: ride_height
  direction: decrease          # lower car — faster reaction, more overall grip, better on smooth
  effects:
    - { axis: reaction_speed, change: faster }
    - { axis: overall_grip, change: more }
    - { axis: high_speed_stability, change: more }
  addresses:
    - { symptom: sluggish_steering }
    - { symptom: twitchy, phase: high_speed }
  conditions:
    amplified_on: [smooth, high_grip, asphalt]
    reduced_on: [bumpy]
  counter_indications: [bottoming]
  magnitude_guidance: "0.5mm at a time via shock preload collars ONLY (HUDY: never via downstop screws), front and rear equally unless deliberately setting rake. HUDY: lowering the car gives faster reaction and more overall grip, and is better on smooth tracks."
  reversal_cost_minutes: 5
  confidence: high
  sources: ["XRAY NT1 Set-Up Book p.13 (Effects of Ride Height Adjustment — Decreasing ride height: increases overall grip, better on smooth tracks)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-rideheight-higher-506
  setting: ride_height
  direction: increase          # raise car — slower reaction, more roll, less grip, better on bumpy
  effects:
    - { axis: reaction_speed, change: slower }
    - { axis: chassis_roll, change: more }
    - { axis: overall_grip, change: less }
    - { axis: bump_handling, change: better }
  addresses:
    - { symptom: bottoming, phase: rough_section }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy]
    reduced_on: [smooth, high_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "0.5mm at a time via shock preload collars ONLY. HUDY: raising the car slows reaction, increases chassis roll and decreases overall grip, but is better on bumpy tracks and gives more clearance to avoid bottoming."
  reversal_cost_minutes: 5
  confidence: high
  # REVIEW: NT1 p.13 confirms "Increasing ride height: decreases overall grip, better on bumpy tracks (prevents bottoming)" — supported. NT1 does NOT explicitly state "slower reaction" or "more chassis roll" for higher ride height (those are HUDY-style additions); the two effects NT1 names are grip-down and bump/bottoming.
  sources: ["XRAY NT1 Set-Up Book p.13 (Effects of Ride Height Adjustment — Increasing ride height: decreases overall grip, better on bumpy tracks, prevents bottoming)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-rideheight-rake-forward-507
  setting: ride_height_rake
  direction: front_lower_than_rear   # rake nose-down (front lower by ~0.5mm) — more steering into corner
  effects:
    - { axis: steering_into_corner, change: more }
    - { axis: corner_stability, change: more }
    - { axis: on_power_oversteer, change: more }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: []
  counter_indications: [oversteer]
  magnitude_guidance: "Set the front ~0.5mm lower than the rear, via preload. HUDY: 'front lower than rear by 0.5mm' increases steering into the corner and stability in corners, but increases on-power oversteer."
  reversal_cost_minutes: 5
  confidence: medium
  # REVIEW: WEAK GROUNDING / FLAG FOR WILLIAM. The XRAY NT1 Set-Up Book ride-height section (p.13) gives only overall lower/higher ride-height effects and has NO explicit front-lower-than-rear (rake) effects table; AE Cheat Sheets has separate front/rear ride-height pages (p.29-30) but likewise NO rake-effect statement of this form. This rule's specific claims (more steering into corner, more in-corner stability, more on-power oversteer) were the discredited HUDY-off-road cite and are NOT verbatim-supported by any on-road source obtained. Cite anchors to NT1's ride-height page so provenance points at the right book/topic, but the rake-specific effects remain UNVERIFIED — William should either source a touring rake reference or drop the rule.
  sources: ["XRAY NT1 Set-Up Book p.13 (Ride Height — section covers ride-height effects; rake/front-lower-than-rear specifics NOT stated, see REVIEW)"]
  scope: [1-10-nitro-onroad]

# =====================================================================================================
# FAMILY 3 — ROLL CENTRE   HUDY Set-Up Book p.31 §2.1 ; XRAY NT1 Set-Up Book p.29
# NOTE the asphalt/carpet disjointness: front RC LOWER is recommended for ASPHALT + low-medium traction;
# front RC HIGHER is recommended for CARPET + high traction. The two opposing-direction rules on
# front_roll_center for understeer are therefore SAFE — their conditions are disjoint.
# =====================================================================================================

- id: kb-no-rollcenter-front-lower-508
  setting: front_roll_center
  direction: lower             # lower front RC — more forward traction & steering response (asphalt/low grip)
  effects:
    - { axis: forward_traction, change: more }
    - { axis: on_throttle_steering, change: more }
    - { axis: steering_response, change: more }
    - { axis: chassis_roll, change: more }
  addresses:
    - { symptom: understeer, phase: on_power }
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: [asphalt, low_grip]
    reduced_on: [carpet, high_grip]
  counter_indications: [traction_roll]
  magnitude_guidance: "One camber-link / pivot step at a time, identical left/right, then re-check camber and ride height (HUDY: roll-centre changes impact downstops, camber and ride height). HUDY: a lower front roll centre improves forward traction and steering response and is recommended for asphalt tracks and low-medium traction."
  reversal_cost_minutes: 8
  confidence: high
  # REVIEW: NT1 p.29 Front RC LOWER: "increases on-throttle steering; DECREASES responsiveness; decreases front weight transfer but INCREASES grip; increases chassis roll; better on SMOOTH HIGH-TRACTION tracks with long fast corners." Supported: more on-throttle steering, more grip, more chassis roll. CONFLICTS: this rule's effect {steering_response: more} contradicts NT1 ("decreases responsiveness"); and NT1 recommends lower front RC for smooth high-traction, NOT this rule's amplified_on [asphalt, low_grip]. The asphalt/low-grip framing was the HUDY claim. Keep for William's review.
  sources: ["XRAY NT1 Set-Up Book p.29 (Effects of Roll Center Adjustment — Front Roll Center, Lower)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-rollcenter-front-higher-509
  setting: front_roll_center
  direction: higher            # higher front RC — easier/less responsive, anti-traction-roll (carpet/high grip)
  effects:
    - { axis: forward_traction, change: less }
    - { axis: responsiveness, change: less }
    - { axis: chassis_roll, change: less }
    - { axis: traction_roll_resistance, change: more }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: traction_roll, phase: mid_corner }
  conditions:
    amplified_on: [carpet, high_grip]
    reduced_on: [asphalt, low_grip]
  counter_indications: [sluggish_steering]
  magnitude_guidance: "One camber-link / pivot step at a time, identical left/right; re-check camber after. HUDY: a higher front roll centre is easier to drive and less responsive, recommended for carpet or high-traction tracks, and (NT1) used in high-grip conditions to avoid traction rolling."
  reversal_cost_minutes: 8
  confidence: high
  # REVIEW: NT1 p.29 Front RC HIGHER: "decreases on-throttle steering; INCREASES responsiveness; increases front weight transfer but DECREASES grip; decreases chassis roll; use in high-grip to avoid traction rolling; better on chicane/quick-direction-change tracks." Supported: less forward grip, less chassis roll, traction-roll resistance, carpet/high-grip amplification. CONFLICT: this rule's effect {responsiveness: less} contradicts NT1 ("increases responsiveness"). Keep for William's review.
  sources: ["XRAY NT1 Set-Up Book p.29 (Effects of Roll Center Adjustment — Front Roll Center, Higher)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-rollcenter-rear-lower-510
  setting: rear_roll_center
  direction: lower             # lower rear RC — improves traction, more on-power push (low grip)
  effects:
    - { axis: rear_traction, change: more }
    - { axis: on_power_push, change: more }
    - { axis: cornering_speed, change: less }
  addresses:
    - { symptom: no_forward_bite, phase: on_power }
    - { symptom: oversteer, phase: on_power }
  conditions:
    amplified_on: [low_grip, asphalt]
    reduced_on: [high_grip, carpet]
  counter_indications: [understeer]
  magnitude_guidance: "One camber-link step at a time, identical left/right; re-check rear camber after. HUDY: a lower rear roll centre improves traction and increases on-power push, recommended for low-traction tracks."
  reversal_cost_minutes: 8
  confidence: high
  sources: ["XRAY NT1 Set-Up Book p.30 (Effects of Roll Center Adjustment — Rear Roll Center, Lower: increases on-throttle/rear grip, better on low-traction tracks)"]
  scope: [1-10-nitro-onroad]

# =====================================================================================================
# FAMILY 4 — CAMBER   HUDY Set-Up Book p.41 §2.7 ; AE RC Cheat Sheets p.12/p.15
# =====================================================================================================

- id: kb-no-camber-front-more-negative-512
  setting: front_camber
  direction: decrease          # more negative front camber — more cornering grip
  effects:
    - { axis: front_cornering_grip, change: more }
  addresses:
    - { symptom: understeer, phase: mid_corner }
    - { symptom: sluggish_steering }
  conditions:
    amplified_on: [high_grip]
    reduced_on: []
  counter_indications: []
  magnitude_guidance: "0.5° at a time. HUDY: more negative (inward) camber increases grip because the side-traction of the wheel increases; adjust front camber so the front tyres wear flat. Note (HUDY p.42): higher caster needs little/no camber, lower caster needs more — re-check after a caster change."
  reversal_cost_minutes: 5
  confidence: high
  sources: ["XRAY NT1 Set-Up Book p.14 (Camber — more negative/inward camber increases grip as side-traction increases; higher caster needs less camber)", "AE RC Cheat Sheets p.12 (Camber, front — more = more high-speed traction through turns)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-camber-rear-less-negative-513
  setting: rear_camber
  direction: increase          # less negative rear camber (toward 0) — more straight-line drive, less rear grip
  effects:
    - { axis: straight_line_acceleration, change: more }
    - { axis: rear_cornering_grip, change: less }
  addresses:
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: []
    reduced_on: []
  counter_indications: [oversteer]
  magnitude_guidance: "0.5° at a time. AE Cheat Sheets: less rear camber (toward 0°) gives more straight-line acceleration; HUDY: more negative camber increases grip, so reducing it trades some rear grip for drive — adjust rear camber so the tyres wear slightly conical to the inside (HUDY p.41)."
  reversal_cost_minutes: 5
  confidence: medium
  sources: ["AE RC Cheat Sheets p.15 (Camber, rear — less = more straight-line acceleration)", "XRAY NT1 Set-Up Book p.14 (Camber — more negative = more grip via side-traction; rear camber set so rear tyres wear slightly conical inside)"]
  scope: [1-10-nitro-onroad]

# =====================================================================================================
# FAMILY 5 — CASTER   HUDY Set-Up Book p.42 §2.8 ; XRAY NT1 Set-Up Book p.16 ; AE RC Cheat Sheets p.16
# =====================================================================================================

- id: kb-no-caster-less-514
  setting: caster
  direction: decrease          # less caster (more vertical) — more entry steering, less straight-line stability
  effects:
    - { axis: off_power_entry_steering, change: more }
    - { axis: straight_line_stability, change: less }
    - { axis: on_power_mid_exit_steering, change: less }
    - { axis: suspension_efficiency, change: more }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: understeer, phase: off_power }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, low_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "One caster step at a time, identical left/right. HUDY: less caster (more vertical) increases off-power steering at corner entry and suspension efficiency but decreases straight-line stability and on-power mid/exit steering. HUDY recommends a shallower (more inclined) caster on smooth high-grip and a steeper (more vertical) angle on slippery/rough — so reduce caster cautiously on rough surfaces."
  reversal_cost_minutes: 10
  confidence: high
  # REVIEW: This rule (less caster -> more corner-ENTRY steering) follows NT1 p.16. The AE p.16 cite text is corrected below to AE's ACTUAL wording, which is the OPPOSITE of NT1 ("less caster = LESS steering entering, MORE exiting"). Sources disagree on caster direction; rule sides with NT1. Flag for William.
  sources: ["XRAY NT1 Set-Up Book p.16 (Effects of Caster Adjustment — Less caster/more vertical: decreases straight-line stability, increases steering at corner entry, decreases steering at mid-corner/exit)", "AE RC Cheat Sheets p.16 (Caster, front — AE states less caster = less steering entering / more exiting; conflicts with NT1)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-caster-more-515
  setting: caster
  direction: increase          # more caster (more inclined) — more straight-line/bump stability, less entry steering
  effects:
    - { axis: straight_line_stability, change: more }
    - { axis: off_power_entry_steering, change: less }
    - { axis: on_power_mid_exit_steering, change: more }
    - { axis: bump_stability, change: more }
  addresses:
    - { symptom: twitchy, phase: high_speed }
    - { symptom: oversteer, phase: corner_entry }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy, low_grip]
    reduced_on: [smooth, high_grip]
  counter_indications: [understeer]
  magnitude_guidance: "One caster step at a time, identical left/right. HUDY: more caster (more inclined) increases straight-line stability and on-power steering out of the corner and is more stable in bumpy conditions, but decreases off-power steering at corner entry."
  reversal_cost_minutes: 10
  confidence: high
  # REVIEW: NT1 p.16 confirms more caster: "increases straight-line stability, DECREASES steering at corner entry, INCREASES steering at mid-corner/exit" — this rule follows NT1's direction. SOURCE DISAGREEMENT: AE Cheat Sheets p.16 states the OPPOSITE ("more caster = MORE steering entering corners, LESS exiting"). The two sources genuinely conflict on caster (a known RC geometry-dependent ambiguity); this rule sides with NT1. NT1 does NOT state a "more stable in bumps" effect (the bump_stability effect + bumpy amplification is the HUDY-style add, plausible but unsupported). Keep NT1-aligned cite; flag the AE conflict for William.
  sources: ["XRAY NT1 Set-Up Book p.16 (Effects of Caster Adjustment — More caster/more inclined: increases straight-line stability, decreases steering at corner entry, increases steering at mid-corner/exit)"]
  scope: [1-10-nitro-onroad]

# =====================================================================================================
# FAMILY 6 — TOE   HUDY Set-Up Book p.44 §2.9 ; XRAY NT1 Set-Up Book p.17
# =====================================================================================================

- id: kb-no-toe-front-less-516
  setting: front_toe
  direction: decrease          # less toe-in / toward toe-out — more entry steering, less stable on power
  effects:
    - { axis: corner_entry_steering, change: more }
    - { axis: steering_response, change: faster }
    - { axis: acceleration_stability, change: less }
    - { axis: ease_of_driving, change: harder }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: sluggish_steering }
  conditions:
    amplified_on: []
    reduced_on: []
  counter_indications: [twitchy, hard_to_drive]
  magnitude_guidance: "0.5° at a time, both steering rods equally. HUDY: less front toe-in (toward toe-out) decreases understeer, increases steering at corner entry and steering response, but is less stable under acceleration and makes the car harder to drive. Front wheels should be neutral or toe-out — never rear toe-out."
  reversal_cost_minutes: 5
  confidence: high
  # REVIEW: NT1 p.17 (Effects of Toe) supports the core direction — less front toe-in / toward toe-out "decreases understeer, increases steering at corner entry." NT1's published table is column-scrambled in extraction so the stability/ease wording can't be cleanly attributed; this rule's "less stable under acceleration / harder to drive" matches the conventional XRAY framing (front toe-out = sharper but nervier). Direction supported; secondary effects are conventional, not verbatim-verified.
  sources: ["XRAY NT1 Set-Up Book p.17 (Effects of Toe Adjustment — Front toe Decreased / toward toe-out: decreases understeer, increases corner-entry steering)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-toe-front-more-517
  setting: front_toe
  direction: increase          # more front toe-in — more on-power and straight-line stability
  effects:
    - { axis: on_power_stability, change: more }
    - { axis: straight_line_stability, change: more }
    - { axis: ease_of_driving, change: easier }
  addresses:
    - { symptom: twitchy }
    - { symptom: hard_to_drive }
  conditions:
    amplified_on: []
    reduced_on: []
  counter_indications: [understeer]
  magnitude_guidance: "0.5° at a time, both steering rods equally. HUDY: more front toe-in is more stable on-power and on the straight (at the expense of some traction/turn-in). Keep the front at neutral or toe-out for steering; only add toe-in to calm a nervous car."
  reversal_cost_minutes: 5
  confidence: medium
  sources: ["XRAY NT1 Set-Up Book p.17 (Effects of Toe Adjustment — Front toe Increased/more toe-in: increases understeer/stability; toe used to stabilize the car at the expense of traction)"]
  scope: [1-10-nitro-onroad]

- id: kb-no-toe-rear-more-518
  setting: rear_toe
  direction: increase          # more rear toe-in — more traction & stability, more push, less cornering speed
  effects:
    - { axis: rear_traction, change: more }
    - { axis: stability, change: more }
    - { axis: understeer, change: more }
    - { axis: cornering_speed, change: less }
  addresses:
    - { symptom: oversteer, phase: on_power }
    - { symptom: oversteer, phase: corner_exit }
    - { symptom: unstable_braking, phase: braking }
  conditions:
