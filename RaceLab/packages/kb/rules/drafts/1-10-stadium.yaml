# 1/10 2WD STADIUM TRUCK — DRAFT tuning rules
#
# STATUS: DRAFT. Not auto-shipped. Pending human citation sign-off before promotion
#   out of rules/drafts/ into the live KB. Schema-validated against the live rule
#   format (packages/kb/rules/geometry.yaml) and the category template
#   (packages/kb/chassis/categories/stadium_truck.json — every `setting:` here is a
#   real key in that template's `fields`, so the engine capability gate passes).
#
# GROUNDING (D18 — grounded or silent). Every rule cites a REAL, page-citable source.
#   PRIMARY backbone: Team Associated "RC Cheat Sheets" (legacy PDF mirror
#   site.petitrc.com/reglages/RC_CheatSheets.pdf — downloaded 2026-06-16, 2.1MB,
#   machine-text-extracted with pdftotext). Page numbers below are the REAL "Page |N"
#   markers from that extraction — NO [TBD]. The cheat sheet is the broadest single
#   cross-category effect-of-change chart and explicitly answers it on the B4/T4/SC10
#   2WD off-road family — i.e. Associated's own stadium-truck (T-series) lineage —
#   so it is the natural authority for this class (sources.json: AE Cheat Sheets,
#   page_cited_quality:true; grounding_assessment lists stadium truck under AE Cheat
#   Sheets coverage).
#   CORROBORATION only (web, mutable — NEVER a sole cite, per D18):
#   "CompetitionX RC Tuning Guide — <topic> (corroboration)". Every CompetitionX cite
#   is paired with the page-cited AE backbone, never standing alone.
#
# STADIUM-TRUCK PHYSICS: a 2WD buggy-derived chassis carrying BIG tyres + a tall body
#   → HIGH centre of gravity. Rear-drive only (front has no drive). The high CG makes
#   traction-roll, rear stability and wheelspin/forward-bite the dominant problems, so
#   this file leans on anti-squat (p.8), rear toe/roll-centre, tyre choice (p.45-47),
#   slipper (p.43), wing (p.52) and ride-height/CG (p.29-30). Surface flips several
#   changes — high-bite changes carry forbidden_on:[loose_dirt] where they hurt on loose
#   dirt. Power class gates motor/gearing legality (none of the chassis rules here are
#   power-gated; they hold for stock_blinky and modified_power alike).
#
# scope on every rule: [1-10-stadium]

# ============================================================================
# FAMILY: ANTI-SQUAT  (AE Cheat Sheets p.8, "Anti-squat, off-road")
#   The headline stadium-truck lever: tames a tall-CG rear-drive truck's forward bite
#   vs. side bite. p.8 verbatim: "less anti-squat → more side traction in corners,
#   more rear traction for slick or bumpy surfaces; more anti-squat → less side
#   traction in corners, more rear lift in jumps."
# ============================================================================

- id: kb-st-antisquat-more-001
  setting: rear_anti_squat
  direction: increase
  effects:
    - { axis: rear_squat_on_power, change: less }
    - { axis: forward_bite_on_acceleration, change: more }
    - { axis: side_traction_in_corners, change: less }
  addresses:
    - { symptom: no_forward_bite, phase: on_power }
    - { symptom: no_forward_bite, phase: corner_exit }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, rough, loose_dirt]
  counter_indications: [traction_roll, oversteer]
  magnitude_guidance: "Shim the front of the rear arm mounts up ~1 deg at a time (AE p.8: shims under the front of the rear arm mounts). More anti-squat plants the rear for drive off the corner; on a tall stadium truck too much costs side bite and can trip a traction-roll on a high-grip corner."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.8 'Anti-squat, off-road' — more anti-squat: less side traction in corners, more rear lift in jumps"
    - "CompetitionX RC Tuning Guide — Anti-Squat (corroboration: more anti-squat adds forward traction on acceleration, reduces it off-power)"
  scope: [1-10-stadium]

- id: kb-st-antisquat-less-002
  setting: rear_anti_squat
  direction: decrease   # flatter rear arms (toward 0 deg)
  effects:
    - { axis: side_traction_in_corners, change: more }
    - { axis: rear_traction_slick_bumpy, change: more }
    - { axis: bumpy_acceleration, change: smoother }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: poor_bump_handling, phase: on_power }
    - { symptom: no_forward_bite, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough, loose_dirt, low_grip]
    reduced_on: [smooth, high_grip]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "Remove a shim from the front of the rear arm mounts, ~1 deg flatter at a time (AE p.8). Flatter arms give more side traction and smoother drive over slick/bumpy ground — the safer direction on a high-CG truck that wants to roll; too flat loses forward bite on smooth high-grip."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.8 'Anti-squat, off-road' — less anti-squat: more side traction in corners, more rear traction for slick or bumpy surfaces"
    - "CompetitionX RC Tuning Guide — Anti-Squat (corroboration: less anti-squat frees off-power rear traction and smooths bumpy acceleration)"
  scope: [1-10-stadium]

# ============================================================================
# FAMILY: CASTER  (AE Cheat Sheets p.16, "Caster, front")
#   p.16 verbatim: "less caster → less steering entering corners, more steering exiting
#   corners; more caster → more steering entering corners, less steering exiting."
# ============================================================================

- id: kb-st-caster-more-003
  setting: caster
  direction: increase   # more inclined kingpin — laid back
  effects:
    - { axis: straight_line_stability, change: more }
    - { axis: on_power_steering_exit, change: more }
    - { axis: bump_stability, change: more }
    - { axis: off_power_steering_entry, change: less }
  addresses:
    - { symptom: twitchy, phase: high_speed }
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: oversteer, phase: corner_entry }
  conditions:
    amplified_on: [bumpy, low_grip]
    reduced_on: [smooth, high_grip]
  counter_indications: [sluggish_steering, understeer]   # more caster REDUCES off-power turn-in
  magnitude_guidance: "One caster-block step at a time (~2 deg). More caster steadies a twitchy truck on the straight, adds on-power exit drive and bump stability; it trades away off-power turn-in, so back off if the truck already pushes on entry."
  reversal_cost_minutes: 15
  confidence: high
  sources:
    # REVIEW: book (Caster, Effects of Caster Adjustment p.18) lists ONLY straight-line stability + off-power entry steering + bump stability for more caster. It does NOT state "on-power steering in mid-corner and corner exit" (on_power_steering_exit effect axis). Over-claim trimmed; that axis rests on the AE corroboration, not the book.
    - "Hudy Setup Tips p.18 (Caster, Effects of Caster Adjustment — more caster angle (more inclined): increases straight-line stability, decreases off-power steering at corner entry, makes the car more stable through bumpy track conditions)"
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.16 'Caster, front' (corroboration: more caster adds straight-line stability and on-power/exit drive steering)"
  scope: [1-10-stadium]

- id: kb-st-caster-less-004
  setting: caster
  direction: decrease   # more vertical kingpin
  effects:
    - { axis: off_power_steering_entry, change: more }
    - { axis: initial_turn_in, change: more }
    - { axis: straight_line_stability, change: less }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, low_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "One caster-block step at a time (~2 deg). Less caster sharpens off-power turn-in for tight smooth tracks; it costs straight-line and bump stability — risky on a tall truck on a fast/rough track."
  reversal_cost_minutes: 15
  confidence: high
  sources:
    - "Hudy Setup Tips p.18 (Caster, Effects of Caster Adjustment — less caster angle (more vertical): decreases straight-line stability, increases off-power steering at corner entry, increases suspension efficiency)"
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.16 'Caster, front' (corroboration: less caster adds off-power/initial turn-in, reduces straight-line stability)"
  scope: [1-10-stadium]

# ============================================================================
# FAMILY: FRONT TOE  (AE Cheat Sheets p.49, "Toe-in, toe-out, front")
#   p.49 verbatim: "0 deg toe standard for all conditions; toe-out → quicker corner
#   turn-in, unstable in bumps and slippery."
# ============================================================================

- id: kb-st-toe-front-out-005
  setting: front_toe
  direction: decrease   # toward toe-out
  effects:
    - { axis: corner_turn_in, change: quicker }
    - { axis: bump_stability, change: less }
    - { axis: slippery_stability, change: less }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: sluggish_steering }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, low_grip]
  counter_indications: [twitchy, poor_bump_handling]
  magnitude_guidance: "0.5 deg at a time, both steering rods equally (AE p.49 calls 1 deg toe-out a typical setting). Adds quicker turn-in; AE warns it is unstable in bumps and slippery — back off on a rough/low-grip stadium track."
  reversal_cost_minutes: 4
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.49 'Toe-in, toe-out, front' — toe-out: quicker corner turn-in, unstable in bumps and slippery"
    - "CompetitionX RC Tuning Guide — Toe (corroboration: front toe-out sharpens corner entry / turn-in)"
  scope: [1-10-stadium]

- id: kb-st-toe-front-in-006
  setting: front_toe
  direction: increase   # toward 0 / toe-in
  effects:
    - { axis: bump_stability, change: more }
    - { axis: slippery_stability, change: more }
    - { axis: corner_turn_in, change: calmer }
  addresses:
    - { symptom: twitchy }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy, low_grip, loose_dirt]
    reduced_on: [smooth, high_grip]
  counter_indications: [sluggish_steering, understeer]
  magnitude_guidance: "0.5 deg at a time toward 0 deg toe (AE p.49: 0 deg is the standard, stable-in-all-conditions setting). Calms a darty front and steadies the truck over bumps and on slippery ground at the cost of some turn-in bite."
  reversal_cost_minutes: 4
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.49 'Toe-in, toe-out, front' — 0 deg toe standard for all conditions; toe-out unstable in bumps and slippery"
    - "CompetitionX RC Tuning Guide — Toe (corroboration: reducing toe-out toward zero calms steering and adds entry stability)"
  scope: [1-10-stadium]

# ============================================================================
# FAMILY: CAMBER  (AE Cheat Sheets p.12 front, p.15 rear)
#   p.12: "less (0 deg) front camber → more straight-line acceleration; more (2 deg)
#   → more high-speed traction through turns." p.15 rear mirrors it.
# ============================================================================

- id: kb-st-camber-front-more-neg-007
  setting: front_camber
  direction: decrease   # more negative camber
  effects:
    - { axis: high_speed_cornering_traction, change: more }
    - { axis: straight_line_acceleration, change: less }
  addresses:
    - { symptom: understeer, phase: mid_corner }
    - { symptom: understeer, phase: high_speed }
  conditions:
    amplified_on: [high_grip]
    reduced_on: [low_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "0.5 deg more negative at a time (AE p.12 cites ~2 deg as the high-traction-through-turns setting). Re-check front toe after — they interact. Loads the outer front tyre for more grip through fast corners."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.12 'Camber, front' — more (2 deg) camber: more high-speed traction through turns"
    - "CompetitionX RC Tuning Guide — Camber (corroboration: more negative front camber raises peak cornering grip, costs straight-line patch)"
  scope: [1-10-stadium]

- id: kb-st-camber-rear-more-neg-008
  setting: rear_camber
  direction: decrease   # more negative rear camber
  effects:
    - { axis: high_speed_cornering_traction, change: more }
    - { axis: straight_line_acceleration, change: less }
  addresses:
    - { symptom: oversteer, phase: mid_corner }
    - { symptom: traction_roll, phase: mid_corner }
  conditions:
    amplified_on: [high_grip]
    reduced_on: [low_grip]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "0.5 deg more negative at a time (AE p.15: more negative rear camber → more high-speed traction through corners). Helps a tall truck hold the rear through a high-grip corner; too much costs forward bite off the corner."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.15 'Camber, rear' — less (-2 deg): more high-speed traction through corners"
    - "CompetitionX RC Tuning Guide — Camber (corroboration: more negative rear camber adds cornering grip, costs straight-line/forward drive)"
  scope: [1-10-stadium]

# ============================================================================
# FAMILY: RIDE HEIGHT  (AE Cheat Sheets p.29 front, p.30 rear)
#   The CG lever for a tall stadium truck. p.29: front lower → more push; higher → more
#   steering + better traction on bumpy tracks. p.30: rear lower → less rear sliding in
#   corners; higher → better acceleration in loose terrain + better lift off jumps.
# ============================================================================

- id: kb-st-rideheight-front-lower-009
  setting: front_ride_height
  direction: decrease
  effects:
    - { axis: front_steering, change: less }
    - { axis: high_speed_stability, change: more }
  addresses:
    - { symptom: twitchy, phase: high_speed }
    - { symptom: traction_roll, phase: mid_corner }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, rough]
  counter_indications: [understeer, bottoming]
  magnitude_guidance: "1mm at a time via the threaded shock collar (AE p.29). Lower front drops CG for a steadier, less roll-prone truck on smooth high grip; AE notes lower front 'creates more push', so expect a touch less steering and watch for bottoming."
  reversal_cost_minutes: 4
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.29 'Ride Height, front' — lower creates more push; higher creates more steering / better traction on bumpy tracks"
    - "CompetitionX RC Tuning Guide — Ride Height (corroboration: lower ride height lowers CG for more stability, less bump clearance)"
  scope: [1-10-stadium]

- id: kb-st-rideheight-front-higher-010
  setting: front_ride_height
  direction: increase
  effects:
    - { axis: front_steering, change: more }
    - { axis: bump_traction, change: more }
    - { axis: high_speed_stability, change: less }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough]
    reduced_on: [smooth, high_grip]
  counter_indications: [traction_roll]
  magnitude_guidance: "1mm at a time via the threaded shock collar (AE p.29). Higher front adds steering and clears bumps; on a tall truck it raises CG and can promote traction-roll on high grip — go back down when the track hooks up."
  reversal_cost_minutes: 4
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.29 'Ride Height, front' — higher creates more steering, more chassis roll and better traction on bumpy tracks"
    - "CompetitionX RC Tuning Guide — Ride Height (corroboration: raising ride height clears rough ground at the cost of stability)"
  scope: [1-10-stadium]

- id: kb-st-rideheight-rear-lower-011
  setting: rear_ride_height
  direction: decrease
  effects:
    - { axis: rear_sliding_in_corners, change: less }
    - { axis: jump_lift, change: less }
  addresses:
    - { symptom: oversteer, phase: mid_corner }
    - { symptom: traction_roll, phase: mid_corner }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, loose_dirt]
  counter_indications: [no_forward_bite, nosedive_jumps]
  magnitude_guidance: "1mm at a time via the threaded shock collar (AE p.30: lower rear → less rear-end sliding in corners). Lowers rear CG to settle a loose/rolling truck on high grip; too low costs forward bite in loose terrain and lift off jumps."
  reversal_cost_minutes: 4
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.30 'Ride Height, rear' — lower: less rear-end sliding in corners"
    - "CompetitionX RC Tuning Guide — Ride Height (corroboration: lower rear ride height adds rear stability and lowers CG)"
  scope: [1-10-stadium]

- id: kb-st-rideheight-rear-higher-012
  setting: rear_ride_height
  direction: increase
  effects:
    - { axis: acceleration_in_loose_terrain, change: more }
    - { axis: jump_lift, change: more }
    - { axis: rear_stability, change: less }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: nosedive_jumps, phase: jumps }
  conditions:
    amplified_on: [loose_dirt, bumpy, low_grip]
    reduced_on: [smooth, high_grip]
  counter_indications: [traction_roll, oversteer]
  magnitude_guidance: "1mm at a time via the threaded shock collar (AE p.30: higher rear → better acceleration in loose terrain, better lift off jumps). Helps forward bite on loose ground and squares up jumps; raises rear CG, so back off if the truck starts to roll."
  reversal_cost_minutes: 4
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.30 'Ride Height, rear' — higher: better acceleration in loose terrain, better lift off jumps"
    - "CompetitionX RC Tuning Guide — Ride Height (corroboration: higher rear adds rear weight transfer and forward bite, clears rough sections)"
  scope: [1-10-stadium]

# ============================================================================
# FAMILY: SHOCKS — OIL & PISTONS  (AE Cheat Sheets p.39 fluid, p.40 pistons)
#   p.39: thinner → faster rebound for many small bumps; thicker → less bottoming out.
#   p.40: smaller holes → more damping/pack, better jump lifts & landings, smoother
#   tracks; larger holes → less damping, for small bumps.
# ============================================================================

- id: kb-st-shockoil-rear-thicker-013
  setting: rear_shock_oil
  direction: increase   # thicker / heavier
  effects:
    - { axis: bottoming_resistance, change: more }
    - { axis: rebound_speed, change: slower }
  addresses:
    - { symptom: bottoming, phase: jumps }
    - { symptom: oversteer, phase: on_power }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough, low_grip]
  counter_indications: [no_forward_bite, poor_bump_handling]
  magnitude_guidance: "One oil step (~50-100 cSt / ~2.5wt) at a time (AE p.39: thicker = less bottoming out). Holds a tall truck flatter on power and on big landings; too thick kills forward bite over chop."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.39 'Shock Fluid' — thicker/heavier (higher viscosity): less bottoming out"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: heavier oil better for smooth tracks, reduces bottoming, less responsive)"
  scope: [1-10-stadium]

- id: kb-st-shockoil-rear-thinner-014
  setting: rear_shock_oil
  direction: decrease   # thinner / lighter
  effects:
    - { axis: rebound_speed, change: faster }
    - { axis: rear_compliance_over_bumps, change: more }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: bouncy, phase: rough_section }
    - { symptom: no_forward_bite, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough, low_grip, loose_dirt]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [oversteer, bottoming]
  magnitude_guidance: "One oil step (~50-100 cSt) thinner at a time (AE p.39: thinner = faster rebound for many small bumps). Frees the rear to recover over washboard for forward bite; too thin lets the rear wallow and bottom."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.39 'Shock Fluid' — thinner/lighter (lower viscosity): faster rebound for many small bumps"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: lighter oil more responsive, better for bumpy conditions)"
  scope: [1-10-stadium]

- id: kb-st-shockoil-front-thicker-015
  setting: front_shock_oil
  direction: increase
  effects:
    - { axis: front_bottoming_resistance, change: more }
    - { axis: initial_steering_reaction, change: slower }
  addresses:
    - { symptom: nosedive_jumps, phase: jumps }
    - { symptom: twitchy, phase: braking }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough]
  counter_indications: [sluggish_steering, understeer]
  magnitude_guidance: "One oil step (~50-100 cSt) at a time (AE p.39: thicker = less bottoming). Slows the front to calm dive into jumps and braking twitch; too thick makes the front skate over bumps and steering go lazy."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.39 'Shock Fluid' — thicker/heavier: less bottoming out"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: heavier front oil slows dive and steering, better on smooth tracks)"
  scope: [1-10-stadium]

- id: kb-st-shockoil-front-thinner-016
  setting: front_shock_oil
  direction: decrease
  effects:
    - { axis: front_compliance_over_bumps, change: more }
    - { axis: initial_steering_reaction, change: faster }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [bumpy, rough, low_grip]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [twitchy, nosedive_jumps]
  magnitude_guidance: "One oil step (~50-100 cSt) thinner at a time (AE p.39: thinner = faster rebound over small bumps). Frees the front to follow rough ground and react quicker on turn-in; too thin lets the front dive on braking and off jumps."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.39 'Shock Fluid' — thinner/lighter: faster rebound for many small bumps"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: lighter front oil more responsive, better over bumps)"
  scope: [1-10-stadium]

- id: kb-st-piston-rear-smaller-holes-017
  setting: rear_shock_piston
  direction: decrease   # smaller / fewer holes — more pack
  effects:
    - { axis: rear_damping_pack, change: more }
    - { axis: jump_landing_hold_up, change: more }
  addresses:
    - { symptom: bottoming, phase: jumps }
    - { symptom: bouncy, phase: jumps }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough]
  counter_indications: [poor_bump_handling, no_forward_bite]
  magnitude_guidance: "One piston step (smaller/fewer holes) at a time (AE p.40: smaller holes = more damping/pack, better jump lifts & landings, for smoother tracks). Adds pack so the rear holds up on landings; too tight and it deflects over chop. AE p.40: one hole smaller ~= +5wt oil."
  reversal_cost_minutes: 12
  confidence: medium
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.40 'Shock Pistons' — smaller holes: more damping/pack, improve jump lifts and landings, for smoother tracks"
    - "CompetitionX RC Tuning Guide — Shock Pistons (corroboration: fewer/smaller holes add pack/high-speed damping for jumps and smooth tracks)"
  scope: [1-10-stadium]

- id: kb-st-piston-rear-larger-holes-018
  setting: rear_shock_piston
  direction: increase   # larger / more holes — freer
  effects:
    - { axis: rear_damping_pack, change: less }
    - { axis: rear_compliance_over_bumps, change: more }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: no_forward_bite, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough, loose_dirt]
    reduced_on: [smooth, high_grip]
  counter_indications: [bottoming]
  magnitude_guidance: "One piston step (larger/more holes) at a time (AE p.40: larger holes = less damping, for small bumps). Frees the rear over bumps for forward bite; pair with the right oil — pistons set the high/low-speed split, oil sets overall rate."
  reversal_cost_minutes: 12
  confidence: medium
  sources:
