# FAMILY: WEIGHT / BATTERY POSITION & WHEELBASE
# ============================================================================

- id: kb-sc-battery-rear-043
  setting: battery_position
  direction: rearward
  effects:
    - { axis: rear_traction, change: more }
    - { axis: on_power_braking_stability, change: more }
    - { axis: steering, change: less }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: oversteer, phase: on_power }
  conditions:
    amplified_on: [low_grip, loose_dirt, bumpy]
    reduced_on: [high_grip]
  counter_indications: [understeer]
  magnitude_guidance: "Shift the pack rearward one step (the SC10 uses a cuttable foam spacer to move the battery). Rearward weight adds rear traction and stability under power/braking; it costs steering. On extreme high/low traction tracks moving the battery can rebalance the truck for better rear grip."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.58 Battery Placement (rearward = less steering, more rear traction; SC10 short-course truck pictured; on extreme-traction tracks moving the battery rebalances the car for better rear traction)"
  scope: [1-10-shortcourse]

- id: kb-sc-battery-forward-044
  setting: battery_position
  direction: forward
  effects:
    - { axis: steering, change: more }
    - { axis: rear_traction, change: less }
    - { axis: nose_down_jumping, change: more }
  addresses:
    - { symptom: understeer, phase: mid_corner }
    - { symptom: understeer, phase: corner_exit }
  conditions:
    amplified_on: [high_grip]
    reduced_on: [low_grip, loose_dirt]
  counter_indications: [oversteer, nosedive_jumps]
  magnitude_guidance: "Shift the pack forward one step. Forward weight adds steering (changes direction slower but bites more) and more nose-down jumping; it costs rear traction. Don't chase it on low grip where the rear needs the weight."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.58 Battery Placement (forward = more steering, less rear traction); p.50 Weight Distribution (front weight = more steering while accelerating, more nose-down jumping)"
  scope: [1-10-shortcourse]

- id: kb-sc-wheelbase-longer-045
  setting: wheelbase
  direction: increase   # longer wheelbase
  effects:
    - { axis: high_speed_stability, change: more }
    - { axis: jumping, change: better }
    - { axis: turn_in_response, change: slower }
  addresses:
    - { symptom: twitchy, phase: high_speed }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [fast_open, bumpy, rough]
    reduced_on: [technical_tight]
  counter_indications: [sluggish_steering]
  magnitude_guidance: "Move one wheelbase shim per side. A longer wheelbase adds high-speed-corner and rough-track stability and better jumping on a tall SC truck; it slows turn-in, so shorten for tight technical tracks."
  reversal_cost_minutes: 8
  confidence: medium
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.51 Wheelbase (longer = slightly more steering [bias forward], better stability; SC) plus p.17 Chassis Length (longer = more stability in high-speed corners, better on rough tracks, better jumping, slower turn-in)"
  scope: [1-10-shortcourse]

- id: kb-sc-wheelbase-shorter-046
  setting: wheelbase
  direction: decrease   # shorter wheelbase
  effects:
    - { axis: rear_traction, change: more }
    - { axis: turn_in_response, change: faster }
    - { axis: high_speed_stability, change: less }
  addresses:
    - { symptom: no_forward_bite, phase: on_power }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [technical_tight]
    reduced_on: [fast_open, bumpy]
  counter_indications: [twitchy]
  magnitude_guidance: "Move one wheelbase shim per side. A shorter wheelbase shifts weight back for more rear traction and quicker left-right turning on tight tracks; it costs high-speed and jumping stability."
  reversal_cost_minutes: 8
  confidence: medium
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.51 Wheelbase (shorter = wheels closer, more rear traction, weight shifted back; quicker left-right turning per p.17 Chassis Length)"
  scope: [1-10-shortcourse]

