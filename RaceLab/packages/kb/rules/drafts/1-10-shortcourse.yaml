# 1/10 SHORT COURSE TRUCK (2WD & 4WD) — DRAFT tuning rules
#
# STATUS: DRAFT. Not auto-shipped / not bundled. Pending human citation sign-off
#   before promotion out of rules/drafts/ into the live KB. Schema-validated against
#   the live rule format (packages/kb/rules/geometry.yaml) and the category template
#   (packages/kb/chassis/categories/short_course.json — every `setting:` here is a real
#   key in that template's `fields`, so the engine capability gate passes).
#
# GROUNDING (D18 — grounded or silent). Every rule cites at least one REAL, page/section
#   source. Two backbone sources were downloaded + text-extracted on 2026-06-16:
#     - "AE RC Cheat Sheets" = RC_CheatSheets.pdf (site.petitrc.com mirror), a fixed-layout,
#       page-numbered PDF whose effect-of-change tables repeatedly use the SC10 short-course
#       truck as the worked example (camber link / caster / ride height / battery placement
#       pages all picture the SC10). Cited with the EXACT page number printed in the file.
#     - "Traxxas Slash Spec Racing Setup Guide" = the OFFICIAL Traxxas article for the Slash
#       2WD short-course truck (traxxas.com/articles/Slash-Spec-Racing-Setup-Guide), fetched
#       and text-extracted. Concrete values quoted verbatim (50wt front / 60wt rear oil,
#       1.0deg toe-out per side, -2.0/-2.5deg camber, 300K diff fluid, rear roll-center
#       upper/lower). An official manufacturer guide for THE archetypal SC truck → citable
#       for SC under the world-map note (sources.json: "most authoritative dedicated
#       short-course source found"). Web article, so it is paired with the page-cited
#       Cheat Sheets PDF and never stands as a sole cite where a page-cite is needed.
#
# SHORT-COURSE-SPECIFIC PHYSICS: a heavy, tall, wide-bodied SCORE truck body. Lots of mass
#   up high → dominant BODY ROLL and a strong TRACTION-ROLL tendency on bite. The body also
#   takes a beating, so shock geometry (position/limiters), roll control (sway bars, springs,
#   ride height) and tyre support (inserts/compound) carry the setup. Distinct 2WD (rear-drive,
#   ball/gear diff + slipper, e.g. Slash) and 4WD (front+center+rear gear diffs, e.g. SC6/SC10
#   4x4) variants exist — diff-oil rules carry both 2WD-dependent fallbacks in their notes.
#
# scope on every rule: [1-10-shortcourse]

# ============================================================================
# FAMILY: SHOCKS — OIL
# ============================================================================

- id: kb-sc-shockoil-rear-thicker-001
  setting: rear_shock_oil
  direction: increase   # thicker / heavier rear oil
  effects:
    - { axis: chassis_roll_on_power, change: less }
    - { axis: landing_pack, change: more }
    - { axis: low_speed_rear_compliance, change: less }
  addresses:
    - { symptom: bottoming, phase: jumps }
    - { symptom: oversteer, phase: on_power }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough, low_grip]
  counter_indications: [no_forward_bite, poor_bump_handling]
  magnitude_guidance: "One oil step (~2.5wt / ~50-100 cSt) thicker at a time. The Slash ships 30wt; the spec guide runs 60wt rear for ample pack on jump landings and to keep the tall body's chassis roll to a minimum. Too thick kills forward bite over bumps."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Traxxas Slash Spec Racing Setup Guide — Shock oil (rears filled with 60wt: ample 'pack' for jump landings, keeps chassis roll to a minimum)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.39 Shock Fluid (higher viscosity / thicker = less bottoming out)"
  scope: [1-10-shortcourse]

- id: kb-sc-shockoil-rear-thinner-002
  setting: rear_shock_oil
  direction: decrease   # thinner / lighter rear oil
  effects:
    - { axis: rear_compliance_over_bumps, change: more }
    - { axis: forward_bite_rough, change: more }
    - { axis: chassis_roll, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: rough_section }
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: bouncy, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough, low_grip]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [oversteer, bottoming]
  magnitude_guidance: "One oil step (~2.5wt) thinner at a time. Frees the rear to follow rough ground for forward bite and faster rebound over small bumps; too thin lets the heavy body roll and wallow."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.39 Shock Fluid (lower viscosity / thinner = faster rebound for many small bumps)"
    - "Traxxas Slash Spec Racing Setup Guide — Shock oil (stock 30wt lets the suspension absorb bumps easily at slower speeds)"
  scope: [1-10-shortcourse]

- id: kb-sc-shockoil-front-thicker-003
  setting: front_shock_oil
  direction: increase   # thicker front oil
  effects:
    - { axis: front_dive_braking, change: less }
    - { axis: initial_steering_reaction, change: slower }
    - { axis: front_bottoming, change: less }
  addresses:
    - { symptom: nosedive_jumps, phase: jumps }
    - { symptom: twitchy, phase: braking }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough]
  counter_indications: [sluggish_steering, understeer]
  magnitude_guidance: "One oil step (~2.5wt) thicker at a time. The spec Slash runs 50wt front — lighter than the 60wt rear because the SC front end is much lighter — to balance the chassis and keep it from bottoming harshly. Too thick makes the front skate over bumps and steering go lazy."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Traxxas Slash Spec Racing Setup Guide — Shock oil (front filled with 50wt, lighter than rear because the front end is much lighter, to balance feel and set the chassis up in the corners)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.39 Shock Fluid (thicker / heavier = less bottoming out)"
  scope: [1-10-shortcourse]

- id: kb-sc-shockoil-front-thinner-004
  setting: front_shock_oil
  direction: decrease   # thinner front oil
  effects:
    - { axis: front_compliance_over_bumps, change: more }
    - { axis: initial_steering_reaction, change: faster }
    - { axis: low_speed_front_grip, change: more }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [bumpy, rough, low_grip]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [twitchy, nosedive_jumps]
  magnitude_guidance: "One oil step (~2.5wt) thinner at a time. Frees the front to react quicker on turn-in and follow rough ground; too thin lets the front dive on braking and off jumps."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.39 Shock Fluid (lower viscosity / thinner = faster rebound for many small bumps)"
    - "Traxxas Slash Spec Racing Setup Guide — Shock oil (lighter damping up front balances the lighter front end)"
  scope: [1-10-shortcourse]

# ============================================================================
# FAMILY: SHOCKS — PISTONS
#  NOTE (engine convention): direction is on the SETTING value. We treat
#  `increase` = MORE / LARGER holes (less damping, less pack), `decrease` = FEWER /
#  SMALLER holes (more damping, more pack). Cheat Sheets p.40: smaller holes = more
#  damping/pack; larger holes = less damping. One hole smaller ~= +5wt oil.
# ============================================================================

- id: kb-sc-piston-rear-fewer-holes-005
  setting: rear_shock_piston
  direction: decrease   # fewer / smaller holes — more pack
  effects:
    - { axis: rear_damping, change: stiffer }
    - { axis: high_speed_pack, change: more }
    - { axis: landing_hold_up, change: more }
  addresses:
    - { symptom: bottoming, phase: jumps }
    - { symptom: bouncy, phase: jumps }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough]
  counter_indications: [poor_bump_handling, no_forward_bite]
  magnitude_guidance: "One piston step (one smaller hole) at a time; the Cheat Sheets note one smaller hole feels like ~+5wt thicker oil. Fewer/smaller holes add pack so the SC body holds up on big landings; too few and it deflects over chop."
  reversal_cost_minutes: 12
  confidence: medium
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.40 Shock Pistons (smaller holes = more damping / more 'pack', improve jump lifts and landings, for smoother tracks)"
  scope: [1-10-shortcourse]

- id: kb-sc-piston-rear-more-holes-006
  setting: rear_shock_piston
  direction: increase   # more / larger holes — freer, less pack
  effects:
    - { axis: rear_damping, change: freer }
    - { axis: rear_compliance_over_bumps, change: more }
    - { axis: high_speed_pack, change: less }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: no_forward_bite, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough]
    reduced_on: [smooth, high_grip]
  counter_indications: [bottoming]
  magnitude_guidance: "One piston step (one larger hole) at a time. Larger holes free the rear over small bumps for compliance and forward bite; pair with oil — pistons set the high/low-speed split, oil sets overall rate. Too free loses landing pack."
  reversal_cost_minutes: 12
  confidence: medium
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.40 Shock Pistons (larger holes = less damping, for small bumps)"
  scope: [1-10-shortcourse]

# ============================================================================
# FAMILY: SHOCKS — POSITION (tower/arm hole) & TRAVEL LIMITERS
#  SC-specific: shock position controls down-travel AND roll. The Slash guide:
#  inner = more down-travel/softer for bumps; outer = stiffer, less roll, more agile.
# ============================================================================

- id: kb-sc-rearshockpos-out-007
  setting: shock_position_rear
  direction: outward   # lower mount further out on the arm — stiffer, less roll
  effects:
    - { axis: rear_roll, change: less }
    - { axis: agility, change: more }
    - { axis: rear_down_travel, change: less }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, rough, big_jumps]
  counter_indications: [poor_bump_handling, bottoming]
  magnitude_guidance: "Move the lower shock mount out one hole on the arm (the Slash has 5 rear positions; base is 2nd from inside). Outer reduces body roll and sharpens agility on smooth tracks with small jumps; on a bumpy track the lost down-travel makes the chassis bounce."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "Traxxas Slash Spec Racing Setup Guide — Shock Position (moving shocks outward decreases the arm's leverage, making the suspension stiffer; smooth tracks with small jumps benefit from moving out one hole to reduce body roll and enhance agility; a bumpy track lacks down-travel and bounces)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.37 Shock Mounting, rear suspension arm (outer hole stiffer, less responsive, more locked in)"
  scope: [1-10-shortcourse]

- id: kb-sc-rearshockpos-in-008
  setting: shock_position_rear
  direction: inward   # lower mount further in on the arm — softer, more travel
  effects:
    - { axis: rear_down_travel, change: more }
    - { axis: bump_compliance, change: more }
    - { axis: rear_roll, change: more }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: bouncy, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough, big_jumps]
    reduced_on: [smooth, high_grip]
  counter_indications: [traction_roll]
  magnitude_guidance: "Move the lower shock mount in one hole on the arm. Inner adds down-travel and softness to soak up bumps and jumps; too far in adds body roll on a tall SC truck and can bring on traction roll on bite."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "Traxxas Slash Spec Racing Setup Guide — Shock Position (moving shocks inward softens the suspension; the base inner/2nd-hole setup offers ample down-travel to soak up bumps and jumps)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.37 Shock Mounting, rear suspension arm (inner hole softer, good for bumps and jumps)"
  scope: [1-10-shortcourse]

- id: kb-sc-frontshockpos-out-009
  setting: shock_position_front
  direction: outward   # stiffer front, less roll/dive
  effects:
    - { axis: front_roll, change: less }
    - { axis: front_down_travel, change: less }
    - { axis: steering_response, change: faster }
  addresses:
    - { symptom: traction_roll, phase: corner_entry }
    - { symptom: twitchy, phase: corner_entry }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, rough]
  counter_indications: [poor_bump_handling]
  magnitude_guidance: "Move the front lower mount out one hole (the Slash front has 2 positions; base is the inner hole). Outer stiffens the front and cuts roll for smooth high-bite tracks; on bumps the lost travel makes the front skip."
  reversal_cost_minutes: 10
  confidence: medium
  sources:
    - "Traxxas Slash Spec Racing Setup Guide — Shock Position (two front positions; base inner hole; moving outward stiffens the suspension)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.35 Shock Mounting, front suspension arm (outer hole stiffer, more stable)"
  scope: [1-10-shortcourse]

- id: kb-sc-rearlimiter-more-010
  setting: shock_limiter_rear
  direction: increase   # more up-travel limiter — controls squat / lean
  effects:
    - { axis: rear_squat_under_power, change: less }
    - { axis: chassis_lean, change: less }
    - { axis: rear_up_travel, change: less }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: bottoming, phase: jumps }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough]
  counter_indications: [poor_bump_handling, no_forward_bite]
  magnitude_guidance: "Add one internal limiter (~1mm) at a time, both rear shocks equal. On a tall, roll-prone SC truck a rear limiter curbs squat and lean so the body stops flopping into traction roll; too much and it deflects over rough ground."
  reversal_cost_minutes: 14
  confidence: medium
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.42 Shock Travel Limiters (more limiters used in side shocks when the car leans too much in turns; in rear shocks they add traction when the front rises on acceleration; fewer for bumpy tracks)"
  scope: [1-10-shortcourse]

- id: kb-sc-rearlimiter-less-011
  setting: shock_limiter_rear
  direction: decrease   # fewer limiters — more travel for bumps
  effects:
    - { axis: rear_up_travel, change: more }
    - { axis: bump_compliance, change: more }
    - { axis: chassis_lean, change: more }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: bouncy, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [traction_roll]
  magnitude_guidance: "Remove one internal limiter (~1mm) at a time, both rear shocks equal. Fewer limiters free up travel so the truck soaks up a bumpy track; too few and the heavy body leans into traction roll on bite."
  reversal_cost_minutes: 14
  confidence: medium
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.42 Shock Travel Limiters (fewer limiters for bumpy tracks)"
  scope: [1-10-shortcourse]

# ============================================================================
# FAMILY: SPRINGS
# ============================================================================

- id: kb-sc-rearspring-softer-012
  setting: rear_spring
  direction: decrease   # softer rear spring
  effects:
    - { axis: rear_traction, change: more }
    - { axis: forward_bite, change: more }
    - { axis: rear_roll, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: no_forward_bite, phase: on_power }
  conditions:
    amplified_on: [low_grip, bumpy, rough]
    reduced_on: [high_grip, smooth]
  counter_indications: [traction_roll, oversteer]
  forbidden_on: [astroturf, carpet]   # a softer rear on very high bite adds roll and traction-rolls a tall SC body
  magnitude_guidance: "One spring rate softer at a time. A softer rear loads the tyres for forward bite on low grip and small bumps; on high-bite surfaces a tall SC truck will roll over, so don't soften on astroturf/carpet."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.41 Shock Springs (softer / lighter tension great on rear for off-road, gives more traction, best for small bumps)"
  scope: [1-10-shortcourse]

- id: kb-sc-rearspring-stiffer-013
  setting: rear_spring
  direction: increase   # stiffer rear spring
  effects:
    - { axis: rear_roll, change: less }
    - { axis: jump_lift, change: more }
    - { axis: rear_traction_low_grip, change: less }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: oversteer, phase: on_power }
  conditions:
    amplified_on: [high_grip, smooth, astroturf, carpet]
    reduced_on: [low_grip, bumpy, rough]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "One spring rate stiffer at a time. A stiffer rear cuts the tall body's roll and traction-roll on high bite and lifts cleaner off jumps; too stiff and it loses rear traction on low grip."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.41 Shock Springs (stiffer / heavier tension creates less traction, lifts higher off jumps, better suspension response)"
  scope: [1-10-shortcourse]

- id: kb-sc-frontspring-softer-014
  setting: front_spring
  direction: decrease   # softer front spring
  effects:
    - { axis: front_grip, change: more }
    - { axis: front_dive_braking, change: more }
    - { axis: steering_into_corner, change: more }
  addresses:
    - { symptom: understeer, phase: mid_corner }
    - { symptom: understeer, phase: corner_entry }
  conditions:
    amplified_on: [low_grip, bumpy, rough]
    reduced_on: [high_grip, smooth]
  counter_indications: [traction_roll, twitchy]
  forbidden_on: [astroturf, carpet]   # soft front on very high bite dives and traction-rolls the front of an SC body
  magnitude_guidance: "One spring rate softer at a time. A softer front loads the front tyres for steering and bump compliance; on very high bite a tall SC front dives and traction-rolls, so don't soften on astroturf/carpet."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.41 Shock Springs (softer / lighter tension gives more traction, best for small bumps)"
  scope: [1-10-shortcourse]

- id: kb-sc-frontspring-stiffer-015
  setting: front_spring
  direction: increase   # stiffer front spring
  effects:
    - { axis: front_roll, change: less }
    - { axis: front_dive_braking, change: less }
    - { axis: steering, change: less }
  addresses:
    - { symptom: traction_roll, phase: corner_entry }
    - { symptom: twitchy, phase: corner_entry }
  conditions:
    amplified_on: [high_grip, smooth, astroturf, carpet]
    reduced_on: [low_grip, bumpy, rough]
  counter_indications: [understeer]
  magnitude_guidance: "One spring rate stiffer at a time. A stiffer front cuts front roll and dive and calms a darty SC front on high bite; too stiff and the front pushes."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.41 Shock Springs (stiffer / heavier tension creates less traction, better suspension response)"
  scope: [1-10-shortcourse]

# ============================================================================
# FAMILY: GEOMETRY — camber / caster / toe
# ============================================================================

- id: kb-sc-frontcamber-more-neg-016
  setting: front_camber
  direction: decrease   # more negative front camber
  effects:
    - { axis: cornering_front_grip, change: more }
    - { axis: straight_line_acceleration, change: less }
  addresses:
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: [high_grip]
    reduced_on: [low_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "0.25-0.5deg more negative at a time. The spec Slash bases -2.0deg front for a good contact patch through the corner, and dials in more on heavily rutted tracks. Loads the outer front tyre when the body leans; too much costs straight-line patch."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "Traxxas Slash Spec Racing Setup Guide — Camber Front (base -2.0deg gives a good contact patch through the corner; more on heavily rutted tracks)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.12 Camber, front (more / 2deg = more high-speed traction through turns; less / 0deg = more straight-line acceleration)"
  scope: [1-10-shortcourse]

- id: kb-sc-rearcamber-more-neg-017
  setting: rear_camber
  direction: decrease   # more negative rear camber
  effects:
    - { axis: cornering_rear_grip, change: more }
    - { axis: forward_traction, change: less }
  addresses:
    - { symptom: oversteer, phase: mid_corner }
    - { symptom: traction_roll, phase: mid_corner }
  conditions:
    amplified_on: [high_grip]
    reduced_on: [low_grip]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "0.25-0.5deg more negative at a time. The spec Slash bases -2.5deg rear and tunes it by how much rear traction the track needs. More rear camber adds mid-corner grip when the body leans; it costs straight-line forward traction."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "Traxxas Slash Spec Racing Setup Guide — Camber Rear (base -2.5deg; changed based on how much rear traction the track needs)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.15 Camber, rear (less / -2deg = more high-speed traction through corners; more / 2+deg removes straight-line acceleration)"
  scope: [1-10-shortcourse]

- id: kb-sc-rearcamber-less-neg-018
  setting: rear_camber
  direction: increase   # toward 0 / less negative rear camber
  effects:
    - { axis: forward_traction, change: more }
    - { axis: straight_line_acceleration, change: more }
    - { axis: cornering_rear_grip, change: less }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: no_forward_bite, phase: on_power }
  conditions:
    amplified_on: [low_grip]
    reduced_on: [high_grip]
  counter_indications: [oversteer]
  magnitude_guidance: "0.25-0.5deg toward 0 at a time; never go positive. Standing the rear tyres up puts a flatter patch down for forward bite and acceleration; too little and mid-corner rear grip drops."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.15 Camber, rear (less negative / toward 0 = more straight-line acceleration)"
    - "Traxxas Slash Spec Racing Setup Guide — Camber Rear (rear camber set by how much rear traction is needed)"
  scope: [1-10-shortcourse]

- id: kb-sc-caster-more-019
  setting: caster
  direction: increase   # more caster — more laid back
  effects:
    - { axis: on_power_steering_exit, change: less }
    - { axis: off_power_steering_entry, change: more }
    - { axis: straight_line_stability, change: more }
  addresses:
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, rough, low_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "One caster step at a time. Per the Cheat Sheets, more caster on the SC10 adds steering ENTERING corners (off-power turn-in) and straight stability, at the cost of on-power/exit steering. (Note SC10/Slash kingpin caster is set by the caster blocks.)"
  reversal_cost_minutes: 15
  confidence: medium
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.16 Caster, front (more caster = more steering entering corners, less steering exiting corners; SC10 short-course truck pictured)"
  scope: [1-10-shortcourse]

- id: kb-sc-caster-less-020
  setting: caster
  direction: decrease   # less caster — more upright
  effects:
    - { axis: on_power_steering_exit, change: more }
    - { axis: off_power_steering_entry, change: less }
    - { axis: straight_line_stability, change: less }
  addresses:
    - { symptom: understeer, phase: corner_exit }
    - { symptom: understeer, phase: on_power }
  conditions:
    amplified_on: [smooth, high_grip]
    reduced_on: [bumpy, rough, low_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "One caster step at a time. Per the Cheat Sheets, less caster on the SC10 frees steering EXITING corners on power at the cost of entry steering and straight-line/bump stability — avoid on rough/loose tracks."
  reversal_cost_minutes: 15
  confidence: medium
