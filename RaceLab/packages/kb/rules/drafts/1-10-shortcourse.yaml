- id: kb-sc-reartire-softer-047
  setting: tire_rear_compound
  direction: decrease   # softer rear compound
  effects:
    - { axis: rear_mechanical_grip, change: more }
    - { axis: forward_bite, change: more }
    - { axis: wear_and_heat, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: no_forward_bite, phase: on_power }
  conditions:
    amplified_on: [low_grip, cold, smooth]
    reduced_on: [high_grip, hot, bumpy]
  counter_indications: []
  magnitude_guidance: "Step one compound softer (and match tread to the surface first). Softer rears add forward bite on low-bite/cold/smoother surfaces; on bumpy/abrasive/hot tracks they overheat and wear fast — match compound to surface and temperature."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.45 Tyre Compound (softer compound for smoother surfaces and higher temperatures)"
  scope: [1-10-shortcourse]

- id: kb-sc-reartire-harder-048
  setting: tire_rear_compound
  direction: increase   # harder rear compound
  effects:
    - { axis: heat_resistance, change: more }
    - { axis: wear_life, change: more }
    - { axis: low_grip_bite, change: less }
  addresses:
    - { symptom: oversteer, phase: mid_corner }
  conditions:
    amplified_on: [high_grip, hot, bumpy, wet]
    reduced_on: [low_grip, cold, smooth]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "Step one compound harder. On bumpy/abrasive/hot (or wet/grass) surfaces a harder rear stays consistent where a soft tyre greases over; useless on cold/smooth low-bite tracks."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.45 Tyre Compound (harder compound for bumpier surfaces, for grass, for wet conditions)"
  scope: [1-10-shortcourse]

- id: kb-sc-rearinsert-firmer-049
  setting: tire_rear_insert
  direction: increase   # firmer rear insert
  effects:
    - { axis: sidewall_support, change: more }
    - { axis: traction_roll_resistance, change: more }
    - { axis: low_speed_conformity, change: less }
  addresses:
