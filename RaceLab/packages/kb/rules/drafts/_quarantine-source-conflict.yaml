# from 1-10-nitro-onroad.yaml
- id: kb-no-rollcenter-rear-higher-511
  setting: rear_roll_center
  direction: higher            # higher rear RC — improves rotation & on-power steering (high grip)
  effects:
    - { axis: rotation, change: more }
    - { axis: on_power_steering, change: more }
    - { axis: rear_grip, change: less }
  addresses:
    - { symptom: understeer, phase: on_power }
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: [high_grip, carpet]
    reduced_on: [low_grip, asphalt]
  counter_indications: [oversteer]
  magnitude_guidance: "One camber-link step at a time, identical left/right; re-check rear camber after. HUDY: a higher rear roll centre improves rotation and increases on-power steering, recommended for high-traction tracks."
  reversal_cost_minutes: 8
  confidence: high
  # REVIEW: CONFLICT. NT1 p.30 Rear RC HIGHER reads: "DECREASES on-throttle steering; increases front weight transfer but decreases grip; increases responsiveness; decreases chassis roll; use in high-grip to avoid traction rolling; better on chicane tracks." This DIRECTLY CONTRADICTS this rule's claim that a higher rear RC gives MORE on-power steering and rotation. Per NT1, a higher rear RC reduces on-throttle steering. Only the {rear_grip: less} effect and high_grip/carpet condition match NT1. Flag for William — the on-power-steering direction may be inverted for the nitro on-road class.
  sources: ["XRAY NT1 Set-Up Book p.30 (Effects of Roll Center Adjustment — Rear Roll Center, Higher)"]
  scope: [1-10-nitro-onroad]

