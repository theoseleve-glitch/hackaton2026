    - { axis: chassis_roll, change: less }
    - { axis: braking_smoothness, change: more }
  addresses:
    - { symptom: sluggish_steering }
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: [smooth, high_grip, carpet]
    reduced_on: [bumpy, low_grip]
  counter_indications: [twitchy, traction_roll]
  magnitude_guidance: "One spring step at a time, left/right identical. HUDY: stiffer front springs increase steering response, in-corner and on-power steering, and are smoother under braking; suited to tight, high-traction, not-too-bumpy tracks."
  reversal_cost_minutes: 10
  confidence: high
  # REVIEW: CONFLICT with NT1. NT1 p.8 Stiffer FRONT springs: "increases mid-corner and corner-exit UNDERSTEER, increases steering under braking, more responsive but more nervous." This rule uses stiffer front to ADDRESS understeer@mid_corner and sluggish steering — but per NT1 a stiffer front INCREASES mid-corner understeer (the opposite). NT1 supports only the responsiveness/less-roll/braking effects. The understeer-fix direction looks INVERTED on NT1's table (NT1 would cure mid-corner understeer with SOFTER front). Flag for William.
  sources: ["XRAY NT1 Set-Up Book p.8 (Effects of Spring Rate Selection — Stiffer front springs)"]
  scope: [1-8-gt]

