# 1/10 4WD electric off-road buggy — DRAFT tuning rules
#
# STATUS: DRAFT. Not auto-shipped. Pending human citation sign-off before promotion
#   out of rules/drafts/ into the live KB. Schema-validated against the live rule
#   format (packages/kb/rules/geometry.yaml) and the category template
#   (packages/kb/chassis/categories/1_10_offroad_4wd.json — every `setting:` here is a
#   real key in that template's `fields`, so the engine capability gate passes).
#
# GROUNDING (D18 — grounded or silent). Every rule cites at least one REAL,
#   page-cited off-road source. NO [TBD]. Two page-citable backbone PDFs were
#   downloaded and read verbatim with pdftotext on 2026-06-16:
#     - "AE RC Cheat Sheets (RC_CheatSheets.pdf)" — site.petitrc.com/reglages/RC_CheatSheets.pdf,
#       114-page fixed-layout PDF, machine-text-extractable. Every page number below was
#       confirmed by reading that exact page. The off-road effect tables explicitly use the
#       Team Associated B44.1 4WD buggy as the worked example on pp.12/15/29/36/38/50.
#     - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf)" — site.petitrc.com/reglages/BuggySetupGuide.pdf,
#       4-page off-road buggy quick-reference (Steve Butts, Kyosho America team driver). Page
#       map confirmed by reading: p1 tyres/springs/damping/caster, p2 ride-height/wheelbase/
#       anti-squat/pistons/lower-shock-mount, p3 upper-shock-mount/roll-center-links/camber/toe,
#       p4 anti-roll-bar/ackermann/travel-limiters/gearing.
#   CORROBORATION (web, mutable — NEVER a sole cite, per D18): "CompetitionX RC Tuning Guide".
#   Every rule carries at least one of the two page-cited PDFs above, so none rests on web alone.
#
# 4WD-SPECIFIC PHYSICS: the front axle is DRIVEN. The three diffs (front / centre / rear)
#   are the extra lever a 2WD does not have, and they are the headline tuning tool — front-diff
#   oil trades entry steering vs mid-corner stability, centre-diff oil trades drive/acceleration
#   vs steering and push, rear-diff oil trades rotation vs on-power stability. A 4WD is more
#   planted than a 2WD but PUSH-PRONE (the driven front resists rotation), so most of the
#   steering-recovery levers (thinner front/centre diff, sway bars, weight balance) earn their keep.
#   Surface flips several changes — high-bite changes carry forbidden_on:[loose_dirt].
#
# scope on every rule: [1-10-4wd-offroad, 1-10-offroad] — the 4WD-specific tag is listed
#   FIRST so the draft validator's capability check resolves to the 4WD category template
#   (which exposes the three diff-oil fields); both tags drive retrieval by set-intersection,
#   so order is irrelevant at advice time.

# ============================================================================
# FAMILY: DIFFERENTIALS — front / centre / rear  (the 4WD headline lever)
# ============================================================================

- id: kb-4wd-frontdiff-thicker-001
  setting: front_diff_oil
  direction: increase   # thicker / heavier front diff oil
  effects:
    - { axis: corner_entry_steering, change: less }
    - { axis: mid_corner_front_traction, change: more }
    - { axis: on_power_stability, change: more }
  addresses:
    - { symptom: oversteer, phase: corner_entry }
    - { symptom: twitchy, phase: corner_entry }
  conditions:
    amplified_on: [high_grip, smooth, astroturf]
    reduced_on: [low_grip, loose_dirt]
  counter_indications: [understeer]
  magnitude_guidance: "One oil step (~few thousand cSt, or the next labelled grade) thicker at a time. A thicker front diff tightens the driven front to calm entry and add mid-corner front traction and on-power stability; too thick and the front pushes on entry."
  reversal_cost_minutes: 25
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.19 Diff Fluid, Front Diff, off-road (thicker = less steering but more stability on power, for high-traction conditions)"
    - "CompetitionX RC Tuning Guide — Differential (corroboration: thicker front diff oil reduces corner-entry steering, adds mid-corner stability)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-frontdiff-thinner-002
  setting: front_diff_oil
  direction: decrease   # thinner / lighter front diff oil
  effects:
    - { axis: corner_entry_steering, change: more }
    - { axis: mid_corner_front_traction, change: less }
    - { axis: on_power_stability, change: less }
  addresses:
    - { symptom: understeer, phase: corner_entry }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [low_grip, loose_dirt]
    reduced_on: [high_grip, smooth, astroturf]
  counter_indications: [oversteer, twitchy]
  magnitude_guidance: "One oil step thinner at a time. A thinner front diff frees the driven front to differentiate for sharper corner-entry steering on low grip — the first lever against 4WD push; too thin makes the car darty and unstable on entry."
  reversal_cost_minutes: 25
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.19 Diff Fluid, Front Diff, off-road (thinner = more steering but less stability, for low-traction conditions)"
    - "CompetitionX RC Tuning Guide — Differential (corroboration: thinner front diff oil frees entry steering on low grip)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-centerdiff-thicker-003
  setting: center_diff_oil
  direction: increase   # thicker / heavier centre diff oil
  effects:
    - { axis: forward_drive_acceleration, change: more }
    - { axis: overall_steering, change: less }
    - { axis: on_power_push, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: on_power }
    - { symptom: no_forward_bite, phase: corner_exit }
  conditions:
    amplified_on: [high_grip, smooth, astroturf]
    reduced_on: [low_grip, loose_dirt, bumpy]
  counter_indications: [understeer]
  forbidden_on: [loose_dirt]   # a locked centre on loose dirt just spins all four and pushes
  magnitude_guidance: "One oil step (~5-10k cSt) thicker at a time. A thicker centre diff locks front-to-rear for harder drive off the corner on grip; it costs steering and adds push and gets worse in bumps, so don't chase it on loose/rough tracks."
  reversal_cost_minutes: 25
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.18 Diff Fluid, Centre Diff, off-road (thicker = accelerates harder but worse in bumps, for smooth high-traction conditions)"
    - "CompetitionX RC Tuning Guide — Centre Differential (corroboration: thicker centre oil adds drive and push, reduces steering)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-centerdiff-thinner-004
  setting: center_diff_oil
  direction: decrease   # thinner / lighter centre diff oil
  effects:
    - { axis: overall_steering, change: more }
    - { axis: smoothness_in_bumps, change: more }
    - { axis: forward_drive_acceleration, change: less }
  addresses:
    - { symptom: understeer, phase: on_power }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [low_grip, loose_dirt, bumpy, rough]
    reduced_on: [high_grip, smooth, astroturf]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "One oil step thinner at a time. A thinner centre diff frees rotation and steering and smooths acceleration over bumps for low-grip/rough tracks; too thin and the car loses drive off the corner on grip."
  reversal_cost_minutes: 25
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.18 Diff Fluid, Centre Diff, off-road (thinner = smoother acceleration, better in bumps, for rough low-traction conditions)"
    - "CompetitionX RC Tuning Guide — Centre Differential (corroboration: thinner centre oil frees steering and rotation)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-reardiff-thicker-005
  setting: rear_diff_oil
  direction: increase   # thicker / heavier rear diff oil
  effects:
    - { axis: rear_grip_on_power, change: less }
    - { axis: on_power_stability, change: more }
    - { axis: corner_rotation, change: less }
  addresses:
    - { symptom: oversteer, phase: on_power }
    - { symptom: oversteer, phase: corner_exit }
  conditions:
    amplified_on: [high_grip, smooth, astroturf]
    reduced_on: [low_grip, loose_dirt]
  counter_indications: [understeer]
  magnitude_guidance: "One oil step (~1-2k cSt) thicker at a time. A thicker rear diff smooths power delivery and adds on-power stability so the rear stops stepping out; too thick and the car won't rotate and pushes."
  reversal_cost_minutes: 22
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.21 Diff Fluid, Rear Diff, off-road (thicker = less grip but more stability on power, for high-traction conditions)"
    - "CompetitionX RC Tuning Guide — Differential (corroboration: thicker rear diff oil smooths power, adds stability, reduces rotation)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-reardiff-thinner-006
  setting: rear_diff_oil
  direction: decrease   # thinner / lighter rear diff oil
  effects:
    - { axis: rear_grip_on_power, change: more }
    - { axis: corner_rotation, change: more }
    - { axis: on_power_stability, change: less }
  addresses:
    - { symptom: understeer, phase: corner_exit }
    - { symptom: no_forward_bite, phase: corner_exit }
  conditions:
    amplified_on: [low_grip, loose_dirt]
    reduced_on: [high_grip, smooth, astroturf]
  counter_indications: [oversteer]
  magnitude_guidance: "One oil step thinner at a time. A thinner rear diff lets the inside rear differentiate for more mechanical grip and rotation on low grip; too thin and the rear gets loose and unstable on power on high bite."
  reversal_cost_minutes: 22
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.21 Diff Fluid, Rear Diff, off-road (thinner = more grip but less stability on power, for low-traction conditions)"
    - "CompetitionX RC Tuning Guide — Differential (corroboration: thinner rear diff oil adds rear grip and rotation on low grip)"
  scope: [1-10-4wd-offroad]

# ============================================================================
# FAMILY: SHOCK OIL  (front / rear damping rate)
# ============================================================================

- id: kb-4wd-shockoil-front-thicker-007
  setting: front_shock_oil
  direction: increase   # thicker front oil
  effects:
    - { axis: front_dive_braking, change: less }
    - { axis: initial_steering_reaction, change: slower }
    - { axis: front_bottoming, change: less }
  addresses:
    - { symptom: nosedive_jumps, phase: jumps }
    - { symptom: twitchy, phase: braking }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough]
  counter_indications: [sluggish_steering, understeer]
  magnitude_guidance: "One oil step (~50-100 cSt / ~2.5wt) at a time, identical L/R. A heavier front slows dive into jumps and braking and resists bottoming; too thick makes the front skate over bumps and steering go lazy."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.39 Shock Fluid (thicker/heavier = less bottoming out)"
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.1 Damping (Heavier Front: turn radius wider but smoother, the car doesn't hook suddenly, easier to drive)"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: heavier oil less responsive, better for smooth tracks)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-shockoil-front-thinner-008
  setting: front_shock_oil
  direction: decrease   # thinner front oil
  effects:
    - { axis: front_compliance_over_bumps, change: more }
    - { axis: initial_steering_reaction, change: faster }
    - { axis: low_speed_front_grip, change: more }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: sluggish_steering, phase: corner_entry }
  conditions:
    amplified_on: [bumpy, rough, low_grip]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [twitchy, nosedive_jumps]
  magnitude_guidance: "One oil step (~50-100 cSt) thinner at a time. A lighter front follows rough ground and reacts quicker on turn-in for low-speed steering; too thin lets the front dive on braking and off jumps."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.39 Shock Fluid (thinner/lighter = faster rebound, for many small bumps)"
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.1 Damping (Softer Front: steering reacts quicker, more and better low-speed steering)"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: lighter oil more responsive, better for bumps)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-shockoil-rear-thicker-009
  setting: rear_shock_oil
  direction: increase   # thicker rear oil
  effects:
    - { axis: chassis_roll_on_power, change: less }
    - { axis: landing_pack, change: more }
    - { axis: low_speed_rear_compliance, change: less }
  addresses:
    - { symptom: bottoming, phase: jumps }
    - { symptom: oversteer, phase: on_power }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough, low_grip]
  counter_indications: [no_forward_bite, poor_bump_handling]
  magnitude_guidance: "One oil step (~50-100 cSt) at a time. A heavier rear holds the chassis flatter on power and gives pack for landings; too thick kills forward bite and traction over bumps."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.39 Shock Fluid (thicker = less bottoming out)"
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.1 Damping (Heavier: more stable, handles smoothly, jumps and lands better)"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: heavier oil for smooth tracks, decreases responsiveness)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-shockoil-rear-thinner-010
  setting: rear_shock_oil
  direction: decrease   # thinner rear oil
  effects:
    - { axis: rear_compliance_over_bumps, change: more }
    - { axis: forward_bite_rough, change: more }
    - { axis: chassis_roll, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: rough_section }
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: bouncy, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough, low_grip, loose_dirt]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [oversteer, bottoming]
  magnitude_guidance: "One oil step (~50-100 cSt) thinner at a time. A lighter rear reacts over bumps for forward bite and traction on rough/loose ground; too thin lets the rear roll and wallow and bottom on landings."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.39 Shock Fluid (thinner/lighter = faster rebound, for many small bumps)"
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.1 Damping (Softer Rear: very easy to drive, can be thrown into turns, more rear traction while accelerating)"
    - "CompetitionX RC Tuning Guide — Shock Oil (corroboration: lighter oil more responsive, better for bumps, allows more chassis roll)"
  scope: [1-10-4wd-offroad]

# ============================================================================
# FAMILY: SHOCK PISTONS  (damping curve / pack, independent of oil)
# ============================================================================

- id: kb-4wd-piston-rear-more-holes-011
  setting: rear_shock_piston
  direction: increase   # more / larger bleed holes — freer, less pack
  effects:
    - { axis: rear_damping_pack, change: less }
    - { axis: rear_compliance_over_bumps, change: more }
    - { axis: rear_traction_rough, change: more }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: no_forward_bite, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough, loose_dirt]
    reduced_on: [smooth, high_grip, big_jumps]
  counter_indications: [bottoming]
  magnitude_guidance: "One piston step (one larger/extra hole) at a time; adapt oil to keep low-speed feel. Bigger holes mean less pack, so the rear soaks up sharp bumps and finds traction on rough/loose sections instead of being thrown up over them."
  reversal_cost_minutes: 14
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.40 Shock Pistons (larger holes = less damping, for small bumps)"
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.2 Shock Pistons (Bigger Holes: very good for bumpy tracks, more stable and more traction in bumpy sections)"
    - "CompetitionX RC Tuning Guide — Pistons (corroboration: more/larger holes pass oil quicker = more responsive damping; rougher track = more holes)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-piston-rear-fewer-holes-012
  setting: rear_shock_piston
  direction: decrease   # fewer / smaller holes — more pack
  effects:
    - { axis: rear_damping_pack, change: more }
    - { axis: high_speed_pack, change: more }
    - { axis: landing_hold_up, change: more }
  addresses:
    - { symptom: bottoming, phase: jumps }
    - { symptom: bouncy, phase: jumps }
  conditions:
    amplified_on: [smooth, high_grip, big_jumps]
    reduced_on: [bumpy, rough]
  counter_indications: [poor_bump_handling, no_forward_bite]
  magnitude_guidance: "One piston step (one smaller/fewer hole) at a time; one hole smaller feels like ~5wt thicker oil (Cheat Sheet p.40). Fewer holes add pack so the rear locks up over harsh landings and holds the jump line; too few deflects over chop."
  reversal_cost_minutes: 14
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.40 Shock Pistons (smaller holes = more damping / more pack, improve jump lifts and landings, for smoother tracks)"
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.2 Shock Pistons (Smaller Holes: more pack, good for smooth tracks with big jumps or harsh landings)"
    - "CompetitionX RC Tuning Guide — Pistons (corroboration: fewer/smaller holes pass oil slower; smoother track = fewer holes)"
  scope: [1-10-4wd-offroad]

# ============================================================================
# FAMILY: SPRINGS  (front / rear roll stiffness)
# ============================================================================

- id: kb-4wd-frontspring-softer-013
  setting: front_spring
  direction: decrease   # softer front spring
  effects:
    - { axis: front_grip, change: more }
    - { axis: steering_mid_and_exit, change: more }
    - { axis: front_dive_braking, change: more }
  addresses:
    - { symptom: understeer, phase: mid_corner }
    - { symptom: understeer, phase: corner_exit }
  conditions:
    amplified_on: [low_grip, bumpy, loose_dirt]
    reduced_on: [high_grip, smooth]
  counter_indications: [traction_roll, twitchy]
  magnitude_guidance: "One spring rate softer at a time. A softer front loads the front tyres for more mid/exit steering and bump compliance — the spring lever against 4WD push; too soft makes it hook, dive and traction-roll on bite."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.1 Springs (Softer Front: more steering, especially mid and exit of the corner)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.41 Shock Springs (softer = more traction, best for small bumps)"
    - "CompetitionX RC Tuning Guide — Springs (corroboration: softer end gains grip)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-frontspring-stiffer-014
  setting: front_spring
  direction: increase   # stiffer front spring
  effects:
    - { axis: front_roll, change: less }
    - { axis: front_dive_braking, change: less }
    - { axis: steering, change: less }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: twitchy, phase: corner_entry }
  conditions:
    amplified_on: [high_grip, smooth, astroturf]
    reduced_on: [low_grip, loose_dirt, bumpy]
  counter_indications: [understeer]
  magnitude_guidance: "One spring rate stiffer at a time. A stiffer front cuts roll and dive and calms a darty/traction-rolling front on high bite; too stiff and the front pushes and loses low-speed steering."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.1 Springs (Stiffer Front: less front traction and steering, jumps better; on high-grip tracks stiffen the front, makes the car easier to drive and faster)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.41 Shock Springs (stiffer = less traction, lifts higher off jumps, better suspension response)"
    - "CompetitionX RC Tuning Guide — Springs (corroboration: stiffer end reduces roll, loses grip)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-rearspring-softer-015
  setting: rear_spring
  direction: decrease   # softer rear spring
  effects:
    - { axis: rear_traction, change: more }
    - { axis: forward_bite, change: more }
    - { axis: rear_roll, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: no_forward_bite, phase: on_power }
  conditions:
    amplified_on: [low_grip, loose_dirt, bumpy]
    reduced_on: [high_grip, smooth]
  counter_indications: [traction_roll, oversteer]
  forbidden_on: [astroturf]   # very high bite astroturf: a softer rear adds roll and traction-rolls
  magnitude_guidance: "One spring rate softer at a time. A softer rear lets the rear squat and load the tyres for forward bite and rough-track traction; on high bite it brings on traction roll."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.1 Springs (Softer Rear: generally more rear traction, in turns as well as through bumps and while accelerating)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.41 Shock Springs (softer = more traction, great on rear for off-road)"
    - "CompetitionX RC Tuning Guide — Springs (corroboration: softer end gains grip)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-rearspring-stiffer-016
  setting: rear_spring
  direction: increase   # stiffer rear spring
  effects:
    - { axis: rear_roll, change: less }
    - { axis: steering_mid_and_exit, change: more }
    - { axis: rear_traction, change: less }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: understeer, phase: corner_exit }
  conditions:
    amplified_on: [high_grip, smooth, astroturf]
    reduced_on: [low_grip, loose_dirt, bumpy]
  counter_indications: [no_forward_bite, oversteer]
  magnitude_guidance: "One spring rate stiffer at a time. A stiffer rear cuts rear roll/traction-roll and adds mid-and-exit steering on high bite (especially in long fast corners); too stiff and rear traction drops on low grip."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.1 Springs (Stiffer Rear: more steering in the middle and exit of the turn, especially in long high-speed corners; rear traction reduced)"
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.41 Shock Springs (stiffer = creates less traction, better suspension response)"
    - "CompetitionX RC Tuning Guide — Springs (corroboration: stiffer end reduces roll, loses grip)"
  scope: [1-10-4wd-offroad]

# ============================================================================
# FAMILY: GEOMETRY — camber / caster / toe
# ============================================================================

- id: kb-4wd-frontcamber-more-neg-017
  setting: front_camber
  direction: decrease   # more negative front camber
  effects:
    - { axis: high_speed_cornering_grip, change: more }
    - { axis: straight_line_acceleration, change: less }
  addresses:
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: [high_grip]
    reduced_on: [low_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "0.25-0.5deg more negative at a time (typical -1 to -2deg front; bumpy tracks up to -2 to -3deg). Loads the outer front tyre through the corner for more high-speed cornering traction; past that the straight gets nervous."
  reversal_cost_minutes: 5
  confidence: high
  sources:
    - "AE RC Cheat Sheets (RC_CheatSheets.pdf) p.12 Camber, front (more = more high-speed traction through turns; shown on the B44.1 4WD buggy)"
    - "petitrc Buggy Setup Guide (BuggySetupGuide.pdf) p.3 Camber (on really bumpy tracks adding 2-3deg negative camber helps traction and reduces flipping)"
    - "CompetitionX RC Tuning Guide — Camber (corroboration: more front camber = more cornering traction, less stable on the straight)"
  scope: [1-10-4wd-offroad]

- id: kb-4wd-rearcamber-more-neg-018
  setting: rear_camber
  direction: decrease   # more negative rear camber
  effects:
    - { axis: high_speed_cornering_grip, change: more }
    - { axis: straight_line_acceleration, change: less }
  addresses:
    - { symptom: oversteer, phase: mid_corner }
    - { symptom: traction_roll, phase: mid_corner }
  conditions:
    amplified_on: [high_grip]
    reduced_on: [low_grip, loose_dirt]
  counter_indications: [no_forward_bite]
