# 1/8 nitro/electric TRUGGY — DRAFT tuning rules
#
# STATUS: DRAFT. Not auto-shipped. Pending human citation sign-off before
#   promotion out of rules/drafts/ into the live KB. Schema-validated against the
#   live rule format (packages/kb/rules/geometry.yaml) and the category template
#   (packages/kb/chassis/categories/1_8_truggy.json — every `setting:` here is a
#   real key in that template's `fields`, so the engine capability gate passes).
#
# GROUNDING (D18 — grounded or silent). Truggy rides on the 1/8 off-road platform
#   authority. Every rule is anchored to a REAL page-citable backbone source that
#   the author downloaded and read VERBATIM via pdftotext (not a model guess):
#     - Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf, Adam Drake / Mugen
#       Seiki Racing), 8 pages, downloaded from mugenracing.com and text-extracted
#       2026-06-16. Explicitly covers 1/8 off-road buggy AND truggy. PAGE-CITED.
#     - Team Associated RC Cheat Sheets (RC_CheatSheets.pdf, petitrc mirror), the
#       cross-category effect-of-change chart; off-road pages downloaded + extracted
#       2026-06-16 with their printed "Page |N" footers read directly. PAGE-CITED.
#   CompetitionX appears ONLY as corroboration, NEVER as a sole cite.
#
# TRUGGY PHYSICS: a truggy is a taller / heavier / wider buggy on the SAME 1/8
#   off-road platform. Higher CG + more mass => stability is the dominant concern.
#   Rules below LEAN ON the stability levers — anti-squat, sway bars, shock
#   oil/position, ride height, springs, wheelbase, track width — and the magnitude
#   guidance reflects that big-tyre / high-CG sensitivity (one step at a time,
#   stability-biased starting points).
#
# scope on every rule: [1-8-truggy]

# ============================================================================
# FAMILY: DIFFERENTIALS
#   Mugen MSR p.2-3 — front/center/rear diff fluid effect-of-change.
# ============================================================================

- id: kb-tt-diff-front-thicker-001
  setting: front_diff_oil
  direction: increase   # thicker front diff fluid
  effects:
    - { axis: on_power_steering, change: more }
    - { axis: off_power_steering, change: smoother }
    - { axis: rear_grip_on_throttle, change: less }
  addresses:
    - { symptom: understeer, phase: on_power }
    - { symptom: twitchy, phase: off_power }
  conditions:
    amplified_on: [high_grip, smooth]
    reduced_on: [low_grip]
  counter_indications: [oversteer]
  magnitude_guidance: "One viscosity step at a time. Mugen: thicker front diff = smoother off-power steering + more on-power steering; too thick makes the rear loose on throttle. On the heavier truggy go conservative — it amplifies the loose-on-throttle side effect."
  reversal_cost_minutes: 30
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.2 — Front diff fluid"
  scope: [1-8-truggy]

- id: kb-tt-diff-front-thinner-002
  setting: front_diff_oil
  direction: decrease   # thinner front diff fluid
  effects:
    - { axis: off_power_steering, change: more }
    - { axis: on_power_steering, change: less }
  addresses:
    - { symptom: understeer, phase: off_power }
    - { symptom: understeer, phase: corner_entry }
  conditions:
    amplified_on: [technical_tight]
    reduced_on: [high_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "One viscosity step at a time. Mugen: thinner front diff increases off-power steering and decreases on-power steering; too light makes the car twitchy and hard to drive — a real risk on the high-CG truggy."
  reversal_cost_minutes: 30
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.2 — Front diff fluid"
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.19 — Diff Fluid, Front Diff, off-road (corroboration)"
  scope: [1-8-truggy]

- id: kb-tt-diff-center-thicker-003
  setting: center_diff_oil
  direction: increase   # thicker center diff fluid
  effects:
    - { axis: acceleration, change: more }
    - { axis: on_power_steering, change: more }
    - { axis: off_power_steering, change: smoother }
  addresses:
    - { symptom: no_forward_bite, phase: on_power }
    - { symptom: understeer, phase: on_power }
  conditions:
    amplified_on: [high_grip, fast_open]
    reduced_on: [low_grip, bumpy]
  counter_indications: [twitchy]
  magnitude_guidance: "One viscosity step at a time. Mugen: thicker center diff = more acceleration, more on-power steering, smoother off-power steering. Heavier center fluid also calms the heavier truggy's on-throttle behaviour."
  reversal_cost_minutes: 30
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.2-3 — Center diff fluid"
  scope: [1-8-truggy]

- id: kb-tt-diff-center-thinner-004
  setting: center_diff_oil
  direction: decrease   # thinner center diff fluid
  effects:
    - { axis: on_power_traction, change: more }
    - { axis: acceleration, change: less }
    - { axis: off_power_steering, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: understeer, phase: off_power }
  conditions:
    amplified_on: [low_grip, bumpy]
    reduced_on: [high_grip]
  counter_indications: [twitchy]
  magnitude_guidance: "One viscosity step at a time. Mugen: thinner center diff increases on-power traction but decreases acceleration and increases off-power steering. Good for finding bite on a slick, bumpy truggy track."
  reversal_cost_minutes: 30
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.2 — Center diff fluid"
  scope: [1-8-truggy]

- id: kb-tt-diff-rear-thicker-005
  setting: rear_diff_oil
  direction: increase   # thicker rear diff fluid
  effects:
    - { axis: mid_corner_steering, change: smoother }
    - { axis: rear_traction_on_power, change: more }
    - { axis: off_power_steering, change: more_slight }
  addresses:
    - { symptom: no_forward_bite, phase: on_power }
    - { symptom: oversteer, phase: mid_corner }
  conditions:
    amplified_on: [low_grip, bumpy]
    reduced_on: [high_grip]
  counter_indications: [understeer]
  magnitude_guidance: "One viscosity step at a time. Mugen: thicker rear diff = slightly more off-power steering, smoother mid-corner steering, more rear traction on throttle. A stability-friendly first move for a truggy that's loose on power."
  reversal_cost_minutes: 30
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3 — Rear diff fluid"
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.21 — Diff Fluid, Rear Diff, off-road (corroboration)"
  scope: [1-8-truggy]

- id: kb-tt-diff-rear-thinner-006
  setting: rear_diff_oil
  direction: decrease   # thinner rear diff fluid
  effects:
    - { axis: mid_corner_rotation, change: more }
    - { axis: rear_grip_on_throttle, change: less }
  addresses:
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: [technical_tight, high_grip]
    reduced_on: [low_grip]
  counter_indications: [oversteer, no_forward_bite]
  magnitude_guidance: "One viscosity step at a time. Mugen: thinner rear diff gives more mid-corner rotation and makes the rear looser on throttle. Use sparingly on a truggy — it trades away the stability the heavy chassis wants."
  reversal_cost_minutes: 30
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3 — Rear diff fluid"
  scope: [1-8-truggy]

# ============================================================================
# FAMILY: SHOCK OIL  (STABILITY LEVER + temperature compensation)
#   Mugen MSR p.3 — shock oil effect + explicit hot/cold guidance.
# ============================================================================

- id: kb-tt-shockoil-front-thicker-007
  setting: front_shock_oil
  direction: increase   # thicker / heavier front oil
  effects:
    - { axis: overall_traction, change: less }
    - { axis: direction_change_response, change: less }
    - { axis: high_bite_drivability, change: more }
  addresses:
    - { symptom: twitchy, phase: high_speed }
    - { symptom: traction_roll, phase: corner_entry }
  conditions:
    amplified_on: [high_grip, smooth, hot]
    reduced_on: [bumpy, cold]
  counter_indications: [understeer, poor_bump_handling]
  magnitude_guidance: "One oil step (~25-50 cSt) at a time. Mugen: thicker oil = less overall traction, less responsive on direction changes, but EASIER to drive on high-bite/smooth tracks — exactly what a nervous high-CG truggy needs. Go thicker when it gets hot."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3 — Shock oil"
  scope: [1-8-truggy]

- id: kb-tt-shockoil-front-thinner-008
  setting: front_shock_oil
  direction: decrease   # thinner / lighter front oil
  effects:
    - { axis: overall_traction, change: more }
    - { axis: bump_handling, change: better }
    - { axis: responsiveness, change: more }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: understeer, phase: mid_corner }
  conditions:
    amplified_on: [bumpy, low_grip, cold]
    reduced_on: [high_grip, smooth, hot]
  counter_indications: [twitchy, traction_roll]
  magnitude_guidance: "One oil step (~25-50 cSt) at a time. Mugen: lighter shock oil increases traction and is better in the bumps, more responsive. Mugen: when it gets cold outside, go lighter. Watch for added nervousness on the tall truggy."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3 — Shock oil"
  scope: [1-8-truggy]

- id: kb-tt-shockoil-rear-thicker-009
  setting: rear_shock_oil
  direction: increase   # thicker / heavier rear oil
  effects:
    - { axis: chassis_roll_on_power, change: less }
    - { axis: overall_traction, change: less }
    - { axis: high_bite_drivability, change: more }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: twitchy, phase: on_power }
  conditions:
    amplified_on: [high_grip, smooth, hot]
    reduced_on: [bumpy, cold]
  counter_indications: [no_forward_bite, poor_bump_handling]
  magnitude_guidance: "One oil step (~25-50 cSt) at a time. Mugen: thicker oil is easier to drive on high-bite/smooth tracks; go thicker when hot. On the heavy truggy thicker rear oil flattens the chassis and resists the traction-roll its high CG invites."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3 — Shock oil"
  scope: [1-8-truggy]

- id: kb-tt-shockoil-rear-thinner-010
  setting: rear_shock_oil
  direction: decrease   # thinner / lighter rear oil
  effects:
    - { axis: rear_traction, change: more }
    - { axis: bump_handling, change: better }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy, low_grip, cold]
    reduced_on: [high_grip, smooth, hot]
  counter_indications: [traction_roll, twitchy]
  magnitude_guidance: "One oil step (~25-50 cSt) at a time. Mugen: lighter oil = more overall traction, better in bumps. Mugen: when cold, go lighter. Helps a truggy find forward bite on a rough, low-grip surface."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3 — Shock oil"
  scope: [1-8-truggy]

# ============================================================================
# FAMILY: SPRINGS  (STABILITY LEVER)
#   Mugen MSR p.3-4 — front/rear spring rate + grip-dependent guidance.
# ============================================================================

- id: kb-tt-spring-front-stiffer-011
  setting: front_spring
  direction: stiffer
  effects:
    - { axis: front_support, change: more }
    - { axis: steering, change: less }
    - { axis: corner_speed_high_grip, change: more }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: twitchy, phase: corner_entry }
  conditions:
    amplified_on: [high_grip, smooth]
    reduced_on: [low_grip, bumpy]
  counter_indications: [understeer]
  magnitude_guidance: "One spring rate at a time, matched left/right. Mugen: stiffer front springs support the front better and reduce steering; on high-grip tracks stiffer front+rear gives more corner speed and stability — the heavy truggy benefits from the extra support."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3-4 — Springs"
  scope: [1-8-truggy]

- id: kb-tt-spring-front-softer-012
  setting: front_spring
  direction: softer
  effects:
    - { axis: chassis_roll, change: more }
    - { axis: steering, change: more }
    - { axis: overall_grip, change: more }
  addresses:
    - { symptom: understeer, phase: mid_corner }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [low_grip, bumpy]
    reduced_on: [high_grip, smooth]
  counter_indications: [traction_roll, twitchy]
  magnitude_guidance: "One spring rate at a time, matched left/right. Mugen: softer front springs roll more and increase steering; on low-grip tracks softer springs front and rear increase overall grip and improve bump handling. On a truggy, too soft invites traction roll — step gently."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3-4 — Springs"
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.41 — Shock Springs (corroboration: softer gives more traction, best for small bumps)"
  scope: [1-8-truggy]

- id: kb-tt-spring-rear-stiffer-013
  setting: rear_spring
  direction: stiffer
  effects:
    - { axis: rear_support, change: more }
    - { axis: rear_traction_on_exit, change: less }
    - { axis: stability_high_grip, change: more }
  addresses:
    - { symptom: traction_roll, phase: corner_exit }
    - { symptom: twitchy, phase: on_power }
  conditions:
    amplified_on: [high_grip, smooth]
    reduced_on: [low_grip, bumpy]
  counter_indications: [no_forward_bite]
  magnitude_guidance: "One spring rate at a time, matched left/right. Mugen: stiffer rear springs add support but decrease rear traction on corner exit; on high-grip tracks they add stability. Useful to settle a truggy that hooks and rolls on a high-bite exit."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3-4 — Springs"
  scope: [1-8-truggy]

- id: kb-tt-spring-rear-softer-014
  setting: rear_spring
  direction: softer
  effects:
    - { axis: initial_grip, change: more }
    - { axis: forward_traction, change: more }
  addresses:
    - { symptom: no_forward_bite, phase: corner_exit }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [low_grip, bumpy]
    reduced_on: [high_grip, smooth]
  counter_indications: [traction_roll]
  magnitude_guidance: "One spring rate at a time, matched left/right. Mugen: softer rear springs give more initial grip and forward traction; on low-grip tracks softer front+rear increases overall grip. On the heavy truggy too soft will roll — pair with adequate ride height."
  reversal_cost_minutes: 10
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.3-4 — Springs"
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.41 — Shock Springs (corroboration: softer is great on rear for off-road, gives more traction)"
  scope: [1-8-truggy]

# ============================================================================
# FAMILY: PISTONS
#   Mugen MSR p.4 — pack vs hole count.
# ============================================================================

- id: kb-tt-piston-morepack-015
  setting: front_shock_piston
  direction: more_pack   # smaller / fewer holes
  effects:
    - { axis: weight_transfer_speed, change: slower }
    - { axis: responsiveness, change: less }
    - { axis: big_jump_landing, change: better }
  addresses:
    - { symptom: bottoming, phase: jumps }
    - { symptom: twitchy, phase: jumps }
  conditions:
    amplified_on: [big_jumps, smooth]
    reduced_on: [bumpy, rough]
  counter_indications: [poor_bump_handling]
  magnitude_guidance: "Change one piston step (hole count/size), front pair matched, and re-tune oil. Mugen: more pack / smaller holes need lighter oil, give slower weight transfer, less responsiveness, and land large jumps better — valuable for a heavy truggy off big jumps."
  reversal_cost_minutes: 15
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.4 — Pistons"
  scope: [1-8-truggy]

- id: kb-tt-piston-lesspack-016
  setting: rear_shock_piston
  direction: less_pack   # larger / more holes
  effects:
    - { axis: weight_transfer, change: more }
    - { axis: traction, change: more }
    - { axis: bump_absorption, change: better }
  addresses:
    - { symptom: poor_bump_handling, phase: rough_section }
    - { symptom: no_forward_bite, phase: corner_exit }
  conditions:
    amplified_on: [bumpy, rough, low_grip]
    reduced_on: [big_jumps, smooth]
  counter_indications: [bottoming]
  magnitude_guidance: "Change one piston step, rear pair matched, and re-tune oil. Mugen: less pack / larger holes need heavier oil, give more weight transfer, more traction, more responsiveness, and absorb bumps better. Helps a truggy hook up on a rough, low-grip surface."
  reversal_cost_minutes: 15
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.4 — Pistons"
  scope: [1-8-truggy]

# ============================================================================
# FAMILY: SHOCK POSITION  (STABILITY LEVER)
#   Mugen MSR p.4 — shock location on tower / arm.
# ============================================================================

- id: kb-tt-shockpos-tower-out-017
  setting: shock_position_front
  direction: out   # outboard hole on the tower (more upright)
  effects:
    - { axis: responsiveness, change: more }
    - { axis: jumping, change: better }
    - { axis: technical_track_handling, change: better }
  addresses:
    - { symptom: sluggish_steering, phase: corner_entry }
    - { symptom: nosedive_jumps, phase: jumps }
  conditions:
    amplified_on: [technical_tight, smooth]
    reduced_on: [bumpy]
  counter_indications: [twitchy]
  magnitude_guidance: "One hole at a time, both sides. Mugen: moving the shocks OUT on the tower makes the car more responsive, jumps better, and is better on technical tracks. On a truggy use the responsiveness deliberately — it can sharpen an already-tall chassis."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.4 — Shock location"
  scope: [1-8-truggy]

- id: kb-tt-shockpos-tower-in-018
  setting: shock_position_rear
  direction: in   # inboard hole on the tower (more laid down)
  effects:
    - { axis: initial_damping, change: softer }
    - { axis: responsiveness, change: less }
    - { axis: forgiveness, change: more }
  addresses:
    - { symptom: twitchy, phase: high_speed }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough]
    reduced_on: [smooth, high_grip]
  counter_indications: [sluggish_steering]
  magnitude_guidance: "One hole at a time, both sides. Mugen: moving the shocks IN on the tower gives softer initial damping, less responsiveness, and is more forgiving — a good calming move for a nervous truggy on a rough track."
  reversal_cost_minutes: 12
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.4 — Shock location"
  scope: [1-8-truggy]

# ============================================================================
# FAMILY: RIDE HEIGHT  (STABILITY LEVER — critical on a high-CG truggy)
#   Mugen MSR p.8 (front 1-2mm lower than rear) + AE Cheat Sheets p.29-30.
# ============================================================================

- id: kb-tt-rideheight-lower-019
  setting: front_ride_height
  direction: decrease
  effects:
    - { axis: overall_stability, change: more }
    - { axis: chassis_roll, change: less }
    - { axis: cornering_push, change: more }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: twitchy, phase: high_speed }
  conditions:
    amplified_on: [smooth, high_grip, blue_groove]
    reduced_on: [bumpy, rough, big_jumps]
  counter_indications: [bottoming, understeer]
  magnitude_guidance: "0.5-1mm at a time via shock collar/preload. AE: lower front ride height creates more push and less chance of flipping in corners. Lowering CG is the single most effective anti-traction-roll lever on a tall truggy — but don't go so low it bottoms."
  reversal_cost_minutes: 6
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.29 — Ride Height, front"
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.8 — Ride Height"
  scope: [1-8-truggy]

- id: kb-tt-rideheight-higher-020
  setting: rear_ride_height
  direction: increase
  effects:
    - { axis: bottoming_resistance, change: more }
    - { axis: loose_terrain_acceleration, change: better }
    - { axis: jump_lift, change: better }
    - { axis: overall_stability, change: less }
  addresses:
    - { symptom: bottoming, phase: rough_section }
    - { symptom: no_forward_bite, phase: on_power }
  conditions:
    amplified_on: [bumpy, rough, big_jumps, loose_dirt]
    reduced_on: [smooth, high_grip]
  counter_indications: [traction_roll]
  magnitude_guidance: "0.5-1mm at a time via shock collar/preload. AE: higher rear ride height gives better acceleration in loose terrain and better lift off jumps. Mugen baseline: run the front 1-2mm LOWER than the rear. Raising the heavy truggy's CG hurts stability — use only to clear rough ground/jumps."
  reversal_cost_minutes: 6
  confidence: high
  sources:
    - "Team Associated RC Cheat Sheets (RC_CheatSheets.pdf) p.30 — Ride Height, rear"
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.8 — Ride Height"
  scope: [1-8-truggy]

# ============================================================================
# FAMILY: DOWNSTOP / REBOUND (TRAVEL)
#   Mugen MSR p.5-6 — rebound stop / travel.
# ============================================================================

- id: kb-tt-downstop-front-more-travel-021
  setting: front_downstop
  direction: decrease   # arm lower / MORE droop travel
  effects:
    - { axis: on_power_steering, change: more }
    - { axis: rough_track_drivability, change: better }
  addresses:
    - { symptom: understeer, phase: on_power }
    - { symptom: poor_bump_handling, phase: rough_section }
  conditions:
    amplified_on: [bumpy, rough]
    reduced_on: [smooth, high_grip]
  counter_indications: [traction_roll]
  magnitude_guidance: "1mm of travel at a time, measured on the car (Mugen: top-mount centre to bottom-screw centre), identical left/right. Mugen: more front travel increases on-power steering; more travel front and rear lands better and is easier to drive on rough tracks. Too much can traction-roll on bumpy/rutted mid-corners — a real truggy risk."
  reversal_cost_minutes: 8
  confidence: high
  sources:
    - "Mugen MSR Off-Road Tuning Guide (MSR tuning guide.pdf) p.5-6 — Rebound stop (travel)"
  scope: [1-8-truggy]

- id: kb-tt-downstop-rear-less-travel-022
  setting: rear_downstop
  direction: increase   # arm higher / LESS droop travel
  effects:
    - { axis: off_power_steering, change: less }
    - { axis: traction_roll_resistance, change: more }
    - { axis: small_bump_grip, change: less }
  addresses:
    - { symptom: traction_roll, phase: mid_corner }
    - { symptom: oversteer, phase: off_power }
  conditions:
    amplified_on: [bumpy, high_grip]
    reduced_on: [smooth]
  counter_indications: [understeer, poor_bump_handling]
  magnitude_guidance: "1mm of travel at a time, identical left/right. Mugen: more rear travel increases off-power steering; too much travel causes traction roll on bumpy/rutted mid-corners, and less travel slides over small bumps. Reducing rear travel calms a truggy that traction-rolls into ruts."
  reversal_cost_minutes: 8
  confidence: high
