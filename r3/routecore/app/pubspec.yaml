name: routecore
description: RouteCore Platform — common foundation for Waze Terroir and GPS Ecoconduite.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  geolocator: ^13.0.1
  http: ^1.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.2.3
  sensors_plus: ^6.0.1
  flutter_tts: ^4.2.0
  audio_session: ^0.1.21
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # .env doit exister au build (copiez .env.example -> .env, voir README).
    # Volontairement déclaré en asset : flutter_dotenv ne lit que le bundle
    # sur Android/iOS — sans cette ligne, la config serait ignorée sur mobile.
    - .env
    # Données embarquées (base véhicules ADEME compactée, etc.)
    - assets/data/

  # Identité L'Échappée : Fraunces porte l'émotion, Inter porte la clarté
  # (voir docs/DESIGN_SYSTEM_ECHAPPEE.md). Statiques Google Fonts (OFL).
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Italic-600.ttf
          weight: 600
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
