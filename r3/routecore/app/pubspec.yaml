name: routecore
description: RouteCore Platform — common foundation for Waze Terroir and GPS Ecoconduite.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  geolocator: ^13.0.1
  http: ^1.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # .env doit exister au build (copiez .env.example -> .env, voir README).
    # Volontairement déclaré en asset : flutter_dotenv ne lit que le bundle
    # sur Android/iOS — sans cette ligne, la config serait ignorée sur mobile.
    - .env
